<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <title>AVANT — MAPSVR·3D 服务器权威客户端</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           AVANT MAPSVR·3D — 服务器权威客户端 (重新设计)
           主题: 玻璃座舱 + 全屏世界
           语义色: 薄荷绿=已连接/本机/权威 · 钢蓝=标签 · 琥珀=漂移告警
                   红=伤害/错误 · 蓝=其他玩家
           ============================================================ */
        :root {
            --ink: #070a12;
            --panel: rgba(9, 14, 26, .86);
            --panel-solid: #0d1424;
            --signal: #6fe9b0;
            --steel: #8fa6c8;
            --ember: #ff5d5d;
            --amber: #ffc857;
            --ally: #3d9bff;
            --line: rgba(143, 166, 200, .16);
            --line-strong: rgba(143, 166, 200, .32);
            --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            --sans: 'Inter', system-ui, -apple-system, 'Microsoft YaHei', sans-serif;
            --disp: 'Chakra Petch', 'Inter', system-ui, sans-serif;
            --ease: cubic-bezier(.22, .61, .36, 1);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: var(--ink);
            color: #dce7ff;
            font-family: var(--sans);
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        :focus-visible {
            outline: 2px solid var(--signal);
            outline-offset: 2px;
        }

        /* ---------- 顶部遥测条 (玻璃座舱读数条) ---------- */
        #telem {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 42px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            background: linear-gradient(180deg, rgba(6, 9, 16, .94), rgba(6, 9, 16, .72));
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(8px);
            z-index: 90;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: .06em;
        }

        .wordmark {
            font-family: var(--disp);
            font-weight: 700;
            letter-spacing: .32em;
            font-size: 15px;
            color: #eaf2ff;
            white-space: nowrap;
        }

        .wordmark-sub {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: .24em;
            color: var(--signal);
            margin-left: 12px;
            white-space: nowrap;
        }

        .telem-seg {
            display: flex;
            align-items: baseline;
            gap: 7px;
            padding: 0 14px;
            height: 22px;
            border-left: 1px solid var(--line);
            white-space: nowrap;
        }

        .tlbl {
            color: var(--steel);
            font-size: 9px;
            letter-spacing: .2em;
            text-transform: uppercase;
        }

        .dot {
            align-self: center;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #3a4659;
            box-shadow: 0 0 0 3px rgba(58, 70, 89, .18);
            transition: background .2s, box-shadow .2s;
        }

        .dot.online {
            background: var(--signal);
            box-shadow: 0 0 0 3px rgba(111, 233, 176, .18), 0 0 10px rgba(111, 233, 176, .5);
        }

        .dot.connecting {
            background: var(--amber);
            box-shadow: 0 0 0 3px rgba(255, 200, 87, .18);
        }

        .dot.error {
            background: var(--ember);
            box-shadow: 0 0 0 3px rgba(255, 93, 93, .18);
        }

        .console-tab {
            margin-left: auto;
            pointer-events: auto;
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 6px;
            color: var(--steel);
            font: 600 10px var(--disp);
            letter-spacing: .14em;
            padding: 6px 12px;
            cursor: pointer;
            transition: color .15s, border-color .15s, background .15s;
        }

        .console-tab:hover {
            color: var(--signal);
            border-color: var(--signal);
            background: rgba(111, 233, 176, .06);
        }

        /* ---------- 左侧连接控制台 (可折叠滑出) ---------- */
        #console {
            position: fixed;
            left: 0;
            top: 42px;
            bottom: 0;
            width: 298px;
            padding: 14px;
            background: var(--panel);
            border-right: 1px solid var(--line);
            border-top: 1px solid var(--line);
            backdrop-filter: blur(12px);
            z-index: 80;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transform: translateX(0);
            transition: transform .28s var(--ease);
        }

        #console.collapsed {
            transform: translateX(-105%);
        }

        .field span {
            display: block;
            font: 600 9px var(--disp);
            letter-spacing: .18em;
            color: var(--steel);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .field-row {
            display: flex;
            gap: 8px;
        }

        .field-row .field {
            flex: 1;
        }

        input {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #0a0f1c;
            color: #e8f0ff;
            font: 500 13px/1 var(--mono);
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }

        input:focus-visible {
            border-color: var(--signal);
            box-shadow: 0 0 0 3px rgba(111, 233, 176, .14);
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            cursor: pointer;
            padding: 9px 0;
            border-radius: 6px;
            border: 1px solid var(--line-strong);
            background: transparent;
            color: #dce7ff;
            font: 600 12px var(--disp);
            letter-spacing: .14em;
            transition: color .15s, border-color .15s, background .15s, transform .1s;
        }

        .btn:hover {
            color: var(--signal);
            border-color: var(--signal);
            background: rgba(111, 233, 176, .06);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-enter {
            background: linear-gradient(180deg, #0f3d2a, #0a2a1d);
            border-color: rgba(111, 233, 176, .5);
            color: var(--signal);
        }

        .btn-enter:hover {
            background: linear-gradient(180deg, #145036, #0e3425);
            border-color: var(--signal);
        }

        .btn-alt {
            border-color: var(--line);
            color: var(--steel);
        }

        .btn-alt:hover {
            color: var(--amber);
            border-color: var(--amber);
            background: rgba(255, 200, 87, .05);
        }

        #log {
            flex: 1;
            min-height: 0;
            margin: 0;
            overflow: auto;
            padding: 9px;
            background: #05070e;
            border: 1px solid var(--line);
            border-radius: 6px;
            font: 400 11px/1.6 var(--mono);
            color: #9fb6d8;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* ---------- HUD 图层 ---------- */
        #hud {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
        }

        /* 准星 */
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 93, 93, .9);
        }

        #crosshair::before {
            left: 50%;
            top: 0;
            width: 1.5px;
            height: 100%;
            transform: translateX(-50%);
        }

        #crosshair::after {
            top: 50%;
            left: 0;
            height: 1.5px;
            width: 100%;
            transform: translateY(-50%);
        }

        #crosshair .dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2.5px;
            height: 2.5px;
            border-radius: 50%;
            background: #ff5d5d;
            transform: translate(-50%, -50%);
        }

        @keyframes recoil {
            0% {
                transform: translate(-50%, -50%) scale(1.9);
                opacity: .35;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        #crosshair.kick {
            animation: recoil .14s ease;
        }

        /* 击杀播报 */
        #killfeed {
            position: fixed;
            top: 56px;
            right: 14px;
            width: 290px;
            text-align: right;
            font-family: var(--mono);
            font-size: 11px;
        }

        #killfeed div {
            background: rgba(5, 8, 14, .66);
            border: 1px solid var(--line);
            border-left: 2px solid var(--ember);
            padding: 6px 10px;
            margin-bottom: 5px;
            border-radius: 6px;
            animation: kfIn .25s var(--ease), kfOut .6s ease 3.4s forwards;
        }

        @keyframes kfIn {
            from {
                opacity: 0;
                transform: translateX(10px);
            }
        }

        @keyframes kfOut {
            to {
                opacity: 0;
            }
        }

        /* K/D/在线 统计仪表 */
        #stats {
            position: fixed;
            bottom: 16px;
            right: 16px;
            display: flex;
            gap: 18px;
            padding: 11px 16px;
            background: rgba(7, 10, 18, .6);
            border: 1px solid var(--line);
            border-radius: 9px;
            text-align: center;
        }

        .stat .tlbl {
            display: block;
            font-size: 8px;
            margin-bottom: 4px;
        }

        #stats b {
            display: block;
            font: 700 15px var(--mono);
            color: #eaf2ff;
        }

        /* ---------- 底部 · 生命条 ---------- */
        #hpwrap {
            position: fixed;
            left: 16px;
            bottom: 16px;
            width: 250px;
        }

        #hpbar {
            height: 12px;
            background: rgba(0, 0, 0, .45);
            border: 1px solid var(--line);
            border-radius: 6px;
            overflow: hidden;
        }

        #hpfill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #e63946, #ff8a5b);
            transition: width .2s var(--ease);
        }

        #hptext {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .08em;
            color: var(--steel);
            margin-top: 5px;
        }

        /* ---------- 签名元素: SERVER AUTHORITY 漂移仪表 ----------
           左侧工具 · 实时绘制「本机预测 vs 服务器权威」位置偏差 */
        #authority {
            position: fixed;
            left: 16px;
            bottom: 58px;
            width: 250px;
            padding: 12px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
            font-family: var(--mono);
            z-index: 55;
        }

        #authority::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10px;
            right: 10px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--signal), transparent);
            opacity: .55;
        }

        .instrument-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 9px;
        }

        .instrument-title {
            font-family: var(--disp);
            font-weight: 600;
            font-size: 10px;
            letter-spacing: .26em;
            color: var(--signal);
        }

        .instrument-tag {
            font-size: 9px;
            letter-spacing: .14em;
            color: var(--steel);
        }

        #driftCanvas {
            width: 100%;
            height: 40px;
            display: block;
            margin-bottom: 9px;
        }

        .ro {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 10px;
            color: #c6d6f0;
            margin: 3px 0;
            gap: 8px;
            min-width: 0;
        }

        .ro .lbl {
            color: var(--steel);
            font-size: 9px;
            letter-spacing: .1em;
            flex-shrink: 0;
        }

        .val {
            font-size: 10px;
            color: #dce7ff;
            white-space: pre;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .val.good {
            color: var(--signal);
        }

        .val.warn {
            color: var(--amber);
        }

        .drift-row .lbl {
            font-family: var(--disp);
            font-weight: 600;
            letter-spacing: .22em;
            font-size: 9px;
        }

        .drift-row .val {
            font-size: 15px;
            font-weight: 700;
        }

        .drift-row .unit {
            color: var(--steel);
            font-size: 9px;
            margin-left: 2px;
        }

        .cp-other {
            font-size: 10px;
            color: #b9cdf0;
            line-height: 1.7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cp-other .id {
            color: var(--amber);
        }

        .cp-empty {
            color: #51627d;
            font-style: italic;
            font-size: 10px;
        }

        .instrument-toggle {
            pointer-events: auto;
            margin-top: 9px;
            width: 100%;
            padding: 6px 8px;
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 5px;
            color: var(--steel);
            font: 600 10px var(--disp);
            letter-spacing: .14em;
            cursor: pointer;
            transition: color .15s, border-color .15s, background .15s;
        }

        .instrument-toggle:hover {
            color: var(--signal);
            border-color: var(--signal);
            background: rgba(111, 233, 176, .06);
        }

        #othersWrap {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height .25s var(--ease), opacity .2s;
        }

        #othersWrap.open {
            max-height: 150px;
            opacity: 1;
            overflow-y: auto;
        }

        /* ---------- 底部中央提示 ---------- */
        #hint {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(7, 10, 18, .66);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 7px 16px;
            font: 500 11px/1 var(--sans);
            letter-spacing: .06em;
            color: var(--steel);
            transition: opacity .4s, transform .4s;
        }

        #hint.hide {
            opacity: 0;
            transform: translate(-50%, 8px);
        }

        /* ---------- 小地图 ---------- */
        #minimap {
            position: fixed;
            top: 50px;
            left: 14px;
            width: 158px;
            height: 158px;
            background: rgba(7, 10, 18, .55);
            border: 1px solid var(--line);
            border-radius: 10px;
            backdrop-filter: blur(6px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, .3);
            z-index: 55;
        }

        @media (max-width: 760px) {
            #minimap {
                display: none;
            }
        }

        /* ---------- 房间文字聊天 (T键 打开/关闭) ---------- */
        #chat {
            position: fixed;
            left: 50%;
            bottom: 52px;
            transform: translateX(-50%);
            width: min(540px, calc(100vw - 24px));
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 58;
            pointer-events: none;
        }

        #chatLog {
            max-height: 168px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 2px 2px 2px 0;
            scrollbar-width: thin;
            scrollbar-color: rgba(143, 166, 200, .35) transparent;
        }

        .chat-line {
            font: 400 12px/1.55 var(--sans);
            color: #c6d6f0;
            background: rgba(5, 8, 14, .62);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 3px 10px;
            width: fit-content;
            max-width: 100%;
            overflow-wrap: anywhere;
        }

        .chat-line .cid {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .06em;
            margin-right: 7px;
        }

        .chat-line.self {
            border-color: rgba(111, 233, 176, .38);
        }

        .chat-line.self .cid {
            color: var(--signal);
        }

        .chat-line.other .cid {
            color: var(--amber);
        }

        .chat-line.sys {
            color: #51627d;
            font-style: italic;
            border-style: dashed;
        }

        #chatRow {
            display: flex;
            gap: 6px;
            pointer-events: auto;
        }

        #chatInput {
            flex: 1;
            padding: 8px 10px;
            font-size: 12px;
        }

        #chatSend {
            width: 64px;
            padding: 0;
            border: 1px solid rgba(111, 233, 176, .5);
            border-radius: 6px;
            background: linear-gradient(180deg, #0f3d2a, #0a2a1d);
            color: var(--signal);
            font: 600 11px var(--disp);
            letter-spacing: .14em;
            cursor: pointer;
            transition: background .15s, border-color .15s;
        }

        #chatSend:hover {
            border-color: var(--signal);
            background: linear-gradient(180deg, #145036, #0e3425);
        }

        /* ---------- 受击泛红 ---------- */
        #dmgflash {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(230, 57, 70, .5));
            opacity: 0;
            z-index: 60;
        }

        .hidden {
            display: none !important;
        }

        /* ---------- 进入遮罩 (点击进入第一人称) ---------- */
        #blocker {
            position: fixed;
            inset: 0;
            background: radial-gradient(120% 120% at 50% 40%, rgba(6, 9, 16, .55), rgba(3, 5, 9, .92));
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #blocker .card {
            text-align: center;
            padding: 46px 62px;
            border: 1px solid var(--line-strong);
            border-radius: 14px;
            background: rgba(9, 14, 26, .72);
            backdrop-filter: blur(14px);
            box-shadow: 0 24px 80px rgba(0, 0, 0, .5);
            animation: cardIn .45s var(--ease);
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: scale(.97) translateY(6px);
            }
        }

        #blocker .wordmark {
            display: block;
            font-size: 30px;
            letter-spacing: .5em;
            text-indent: .5em;
            color: var(--signal);
            margin-bottom: 12px;
        }

        #blocker h1 {
            margin: 0 0 8px;
            font-family: var(--disp);
            font-weight: 600;
            font-size: 20px;
            letter-spacing: .16em;
            color: #eaf2ff;
        }

        #blocker p {
            margin: 4px 0;
            color: var(--steel);
            font-size: 12.5px;
        }

        #blocker .meta {
            margin-top: 16px;
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .08em;
            color: rgba(143, 166, 200, .7);
        }

        #blocker .enter-hint {
            display: inline-block;
            margin-top: 18px;
            font: 700 11px var(--disp);
            letter-spacing: .3em;
            color: var(--signal);
            border: 1px solid rgba(111, 233, 176, .4);
            border-radius: 999px;
            padding: 8px 22px;
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .45;
            }
        }

        /* ---------- 无障碍与响应式 ---------- */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }

        @media (max-width: 760px) {
            #telem {
                padding: 0 6px;
            }

            .telem-seg {
                padding: 0 8px;
            }

            #telem .wordmark-sub,
            #telem .seg-rtt {
                display: none;
            }

            #console {
                width: 100%;
            }

            #authority {
                width: 200px;
            }

            #stats {
                bottom: 12px;
                right: 12px;
                gap: 12px;
                padding: 8px 12px;
            }

            #stats b {
                font-size: 12px;
            }

            #hint {
                font-size: 10px;
                padding: 6px 12px;
            }
        }

        /* ---------- 移动端触控 (仅触屏设备显示; PC 布局不受影响) ---------- */
        body {
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        #touchctl {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 75;
            display: none;
        }

        body.touch #touchctl {
            display: block;
        }

        #joyBase {
            position: absolute;
            width: 128px;
            height: 128px;
            border-radius: 50%;
            border: 2px solid rgba(111, 233, 176, .3);
            background: radial-gradient(circle, rgba(111, 233, 176, .1), rgba(111, 233, 176, .02));
            box-shadow: 0 0 26px rgba(111, 233, 176, .14);
            transform: translate(-50%, -50%);
            display: none;
        }

        #joyBase.on {
            display: block;
        }

        #joyKnob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, rgba(190, 255, 225, .95), rgba(111, 233, 176, .55));
            box-shadow: 0 2px 10px rgba(0, 0, 0, .4);
            transform: translate(-50%, -50%);
        }

        #btnFire,
        #btnJump,
        #btnCrouch {
            position: absolute;

        #btnJump {

            border-color: rgba(111, 233, 176, .5);

        #btnCrouch {

        /* 触屏设备 HUD 重排 (不影响 PC) */
        body.touch #authority {
            display: none;
        }

        /* 触屏: 聊天上移, 避开右下触控按钮区 (最高约194px) */
        body.touch #chat {
            bottom: calc(204px + env(safe-area-inset-bottom, 0px));
        }

        body.touch #hpwrap {
            top: calc(50px + env(safe-area-inset-top, 0px));

            bottom: auto;
            width: 160px;
        }

        body.touch #stats {
            top: calc(50px + env(safe-area-inset-top, 0px));
            right: 12px;
            bottom: auto;
            gap: 10px;
            padding: 6px 10px;
        }

        body.touch #killfeed {
            top: calc(96px + env(safe-area-inset-top, 0px));
            right: 12px;
            width: 210px;
        }

        body.touch #hint {
            bottom: calc(22px + env(safe-area-inset-bottom, 0px));

            padding: 6px 12px;
        }

        body.touch #telem .wordmark-sub,
        body.touch #telem .seg-map,
        body.touch #telem .seg-seq,
        body.touch #telem .seg-rtt,
        body.touch #telem .seg-online {
            display: none;
        }
    </style>
</head>

<body>

    <!-- 顶部遥测条 -->
    <header id="telem">
        <span class="wordmark">AVANT</span><span class="wordmark-sub">MAPSVR·3D</span>

        <div class="telem-seg seg-seq"><span class="tlbl">SEQ</span><span id="telemSeq">0</span></div>

    <!-- 连接控制台 -->
    <aside id="console" aria-label="连接控制台">

        <div class="field-row">

        </div>

            <button id="btnConnect" class="btn">连接</button>
            <button id="btnLogin" class="btn">登录</button>

            <button id="btnCreateUser" class="btn btn-alt">注册账号</button>

        <pre id="log">等待连接…</pre>
    </aside>

    <!-- HUD 图层 -->
    <div id="hud">
        <div id="crosshair"><div class="dot"></div></div>

        <!-- 签名仪表: 服务器权威漂移监控 -->

            <div class="instrument-head">
                <span class="instrument-title">SERVER AUTHORITY</span>

            <div class="ro drift-row">

            </div>
            <div class="ro"><span id="cpSelfLocal">本机(预测): --</span></div>

            <button id="toggleOthers" class="instrument-toggle">其他玩家 (0) ▾</button>
            <div id="othersWrap">
                <div id="cpOthers"><div class="cp-empty">暂无其他玩家</div></div>
            </div>
        </div>

        <!-- 生命条 -->

        <!-- 击杀播报 -->

        <!-- K/D/在线 统计 -->

            <div class="stat"><span class="tlbl">KILLS</span><b id="kills">0</b></div>
            <div class="stat"><span class="tlbl">DIES</span><b id="deaths">0</b></div>

    <canvas id="minimap" width="316" height="316"></canvas>

    <!-- 房间文字聊天 (进入地图后显示) -->
    <div id="chat" class="hidden">
        <div id="chatLog"></div>
        <div id="chatRow">
            <input id="chatInput" maxlength="120" placeholder="输入消息，Enter 发送" autocomplete="off" spellcheck="false" />
            <button id="chatSend">发送</button>

    <!-- 移动端触控层 (仅触屏设备显示) -->

        <div id="joyBase"><div id="joyKnob"></div></div>
        <button id="btnFire">FIRE</button>
        <button id="btnJump">JUMP</button>
        <button id="btnCrouch">CROUCH</button>
    </div>

    <!-- 进入遮罩 -->
    <div id="blocker" class="hidden">
        <div class="card">
            <span class="wordmark">AVANT</span>
            <h1>点击进入第一人称</h1>
            <p>WASD 移动 / 空格 跳跃 / 鼠标 瞄准 / 点击 射击 / T 聊天</p>
            <p class="meta">按 ESC 退出鼠标锁定 · 左下角实时监控服务器权威坐标</p>
            <span class="enter-hint">点击 进入 ▶</span>
        </div>
    </div>

    <!-- 依赖 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.5/dist/protobuf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
    <script>
        const protoText = `
syntax="proto3";
package avant;
enum ProtoCmd{
    PROTO_CMD_CS_REQ_EXAMPLE = 0; PROTO_CMD_CS_RES_EXAMPLE = 1;
    PROTO_CMD_TUNNEL_MAIN2WORKER_NEW_CLIENT = 2; PROTO_CMD_TUNNEL_PACKAGE = 3;
    PROTO_CMD_TUNNEL_CLIENT_FORWARD_MESSAGE = 4; PROTO_CMD_TUNNEL_WEBSOCKET_BROADCAST = 5;
    PROTO_CMD_TUNNEL_WORKER2OTHER_EVENT_NEW_CLIENT_CONNECTION = 6; PROTO_CMD_TUNNEL_OTHER2WORKER_TEST = 7;
    PROTO_CMD_LUA_TEST = 8; PROTO_CMD_IPC_STREAM_AUTH_HANDSHAKE = 9;
    PROTO_CMD_TUNNEL_WORKER2OTHER_LUAVM = 10; PROTO_CMD_TUNNEL_OTHERLUAVM2WORKERCONN = 11;
    PROTO_CMD_TUNNEL_WORKER2OTHER_EVENT_CLOSE_CLIENT_CONNECTION = 12; PROTO_CMD_TUNNEL_OTHERLUAVM2WORKER_CLOSE_CLIENT_CONNECTION = 13;
    PROTO_CMD_UDP_SAFESTOP_REQ = 14; PROTO_CMD_UDP_SAFESTOP_RES = 15;
    PROTO_CMD_CS_REQ_LOGIN = 2001; PROTO_CMD_CS_RES_LOGIN = 2002;
    PROTO_CMD_CS_MAP_NOTIFY_INIT_DATA = 2003; PROTO_CMD_CS_REQ_MAP_PING = 2004;
    PROTO_CMD_CS_RES_MAP_PONG = 2005; PROTO_CMD_CS_REQ_MAP_INPUT = 2006;
    PROTO_CMD_CS_MAP_NOTIFY_STATE_DATA = 2007; PROTO_CMD_CS_MAP_ENTER_REQ = 2008;
    PROTO_CMD_CS_MAP_ENTER_RES = 2009; PROTO_CMD_CS_MAP_LEAVE_REQ = 2010;
    PROTO_CMD_CS_MAP_LEAVE_RES = 2011; PROTO_CMD_CS_MAP3D_NOTIFY_INIT_DATA = 2012;
    PROTO_CMD_CS_REQ_MAP3D_PING = 2013; PROTO_CMD_CS_RES_MAP3D_PONG = 2014;
    PROTO_CMD_CS_REQ_MAP3D_INPUT = 2015; PROTO_CMD_CS_MAP3D_NOTIFY_STATE_DATA = 2016;
    PROTO_CMD_CS_MAP3D_ENTER_REQ = 2017; PROTO_CMD_CS_MAP3D_ENTER_RES = 2018;
    PROTO_CMD_CS_MAP3D_LEAVE_REQ = 2019; PROTO_CMD_CS_MAP3D_LEAVE_RES = 2020;
    PROTO_CMD_CS_REQ_MAP3D_SHOOT = 2021; PROTO_CMD_CS_RES_MAP3D_SHOOT = 2022;
    PROTO_CMD_CS_MAP3D_NOTIFY_BULLET = 2023; PROTO_CMD_CS_MAP3D_NOTIFY_HIT_PLAYER = 2024;
    PROTO_CMD_CS_MAP3D_NOTIFY_PLAYER_HURT = 2025;
    PROTO_CMD_CS_MAP3D_NOTIFY_MAP_DATA = 2026; PROTO_CMD_CS_MAP3D_NOTIFY_BULLET_WALL_HIT = 2027;
    PROTO_CMD_CS_REQ_MAP3D_CHAT = 2028; PROTO_CMD_CS_MAP3D_NOTIFY_CHAT = 2029;
    PROTO_CMD_DBSVRGO_WRITE_DBUSERRECORD_REQ = 3000; PROTO_CMD_DBSVRGO_SELECT_DBUSERRECORD_REQ = 3001;
    PROTO_CMD_DBSVRGO_SELECT_DBUSERRECORD_RES = 3002; PROTO_CMD_CS_REQ_CREATE_USER = 3003;
    PROTO_CMD_CS_RES_CREATE_USER = 3004; PROTO_CMD_DBSVRGO_INSERT_DBUSERRECORD_REQ = 3005;
    PROTO_CMD_DBSVRGO_INSERT_DBUSERRECORD_RES = 3006; PROTO_CMD_DBSVRGO_SELECT_DBUSERRECORD_LOGIN_REQ = 3007;
    PROTO_CMD_DBSVRGO_SELECT_DBUSERRECORD_LOGIN_RES = 3008;
}
message ProtoPackage{ ProtoCmd cmd=1; bytes protocol=2; }
message ProtoCSReqLogin{ string userId=1; string password=2; }
message ProtoCSMap3DNotifyInitData{ string userId=1; int32 x=2; int32 y=3; int32 z=10; }
message ProtoCSReqMap3DInput{ int32 dirX=1; int32 dirY=2; int32 dirZ=3; uint32 seq=4; uint64 clientTime=5; }
message ProtoMap3DPlayerPayload{ string userId=1; int32 x=2; int32 y=3; int32 z=4; uint32 lastSeq=8; }
message ProtoCSMap3DNotifyStateData{ repeated ProtoMap3DPlayerPayload players=2; }
message ProtoCSMap3DEnterReq{ uint32 mapId=1; }
message ProtoCSMap3DEnterRes{ int32 ret=1; uint32 mapId=2; }
message ProtoCSReqCreateUser{ string userId=1; string password=2; }
message ProtoCSResCreateUser{ int32 ret=1; string userId=2; string password=3; uint64 userRecordID=4; }
message ProtoCSReqMap3DShoot{ string shooterId=1; int32 dirX=2; int32 dirY=3; int32 dirZ=4; int32 shootDist=5; uint64 clientTime=6; }
message ProtoCSResMap3DShoot{ int32 ret=1; int32 damage=2; }
message ProtoCSMap3DNotifyBullet{ string bulletId=1; string shooterId=2; int32 x=3; int32 y=4; int32 z=5; int32 dirX=6; int32 dirY=7; int32 dirZ=8; uint64 lifeTime=9; uint64 spawnTime=10; }
message ProtoCSMap3DNotifyHitPlayer{ string bulletId=1; string targetId=2; int32 damage=3; int32 targetX=4; int32 targetY=5; int32 targetZ=6; }
message ProtoCSMap3DNotifyPlayerHurt{ string targetId=1; int32 hp=2; int32 maxHp=3; int32 damage=4; int32 x=5; int32 y=6; int32 z=7; }
message ProtoCSReqMap3DPing{ uint64 clientTime=1; }
message ProtoCSResMap3DPong{ uint64 clientTime=1; uint64 serverTime=2; }
message ProtoMap3DBoxData{ int32 x=1; int32 y=2; int32 z=3; int32 w=4; int32 h=5; int32 d=6; uint32 color=7; bool collide=8; }
message ProtoCSMap3DNotifyMapData{ uint32 mapId=1; string name=2; int32 groundY=3; repeated ProtoMap3DBoxData boxes=4; int32 centerX=5; int32 centerZ=6; }
message ProtoCSMap3DNotifyBulletWallHit{ string bulletId=1; string shooterId=2; int32 x=3; int32 y=4; int32 z=5; }
message ProtoCSReqMap3DChat{ string message=1; }
message ProtoCSMap3DNotifyChat{ string senderId=1; string message=2; }
`;

        const root = protobuf.parse(protoText).root;
        const ProtoPackage = root.lookupType("avant.ProtoPackage");
        const Cmd = root.lookupEnum("avant.ProtoCmd").values;
        const T_Login = root.lookupType("avant.ProtoCSReqLogin");
        const T_Init = root.lookupType("avant.ProtoCSMap3DNotifyInitData");
        const T_State = root.lookupType("avant.ProtoCSMap3DNotifyStateData");
        const T_Input = root.lookupType("avant.ProtoCSReqMap3DInput");
        const T_Enter = root.lookupType("avant.ProtoCSMap3DEnterReq");
        const T_CreateU = root.lookupType("avant.ProtoCSReqCreateUser");
        const T_CreateR = root.lookupType("avant.ProtoCSResCreateUser");
        const T_Shoot = root.lookupType("avant.ProtoCSReqMap3DShoot");
        const T_ShootR = root.lookupType("avant.ProtoCSResMap3DShoot");
        const T_Bullet = root.lookupType("avant.ProtoCSMap3DNotifyBullet");
        const T_Hit = root.lookupType("avant.ProtoCSMap3DNotifyHitPlayer");
        const T_Hurt = root.lookupType("avant.ProtoCSMap3DNotifyPlayerHurt");
        const T_Ping = root.lookupType("avant.ProtoCSReqMap3DPing");
        const T_Pong = root.lookupType("avant.ProtoCSResMap3DPong");
        const T_EnterR = root.lookupType("avant.ProtoCSMap3DEnterRes");
        const T_MapData = root.lookupType("avant.ProtoCSMap3DNotifyMapData");
        const T_WallHit = root.lookupType("avant.ProtoCSMap3DNotifyBulletWallHit");
        const T_Chat = root.lookupType("avant.ProtoCSReqMap3DChat");
        const T_ChatN = root.lookupType("avant.ProtoCSMap3DNotifyChat");

        const SHOOT_DIST = 200;
        let GROUND_Y = 500000;

        // ---- 坐标校准 ----
        // 服务器以地图中心 (500000,500000) 为绝对坐标基准；客户端收到后平移到本地原点，
        // 使人物出生点落在建筑地图中心 (0,0)。仅在检测到绝对坐标时启用，兼容本地坐标服务器。
        const coordOffset = { x: 0, z: 0 };
        let offsetReady = false;
        function loc(v) {
            return { x: offsetReady ? v.x - coordOffset.x : v.x, y: v.y, z: offsetReady ? v.z - coordOffset.z : v.z };
        }

        const players = new Map();
        const bullets = new Map();
        let selfId = null;
        let lastSeq = 0;
        let kills = 0, deaths = 0;
        let myHp = 100, myMaxHp = 100;

        const logEl = document.getElementById("log");
        function log(...a) {
            const msg = new Date().toLocaleTimeString() + " " + a.join(" ");
            logEl.textContent = msg + "\n" + logEl.textContent;
            if (logEl.textContent.length > 3000) logEl.textContent = "";
        }
        function killfeed(text) {
            const el = document.getElementById("killfeed");
            const d = document.createElement("div");
            d.textContent = text; el.appendChild(d);
            setTimeout(() => d.remove(), 4000);
        }

        /* ------- 新增: 遥测条 / 控制台 / 漂移仪表 引用 ------- */
        const telemUserEl = document.getElementById("telemUser");
        const telemMapEl = document.getElementById("telemMap");
        const telemSeqEl = document.getElementById("telemSeq");
        const telemRttEl = document.getElementById("telemRtt");
        const telemOnlineEl = document.getElementById("telemOnline");
        const connDotEl = document.getElementById("connDot");
        const connStateEl = document.getElementById("connState");
        const consoleEl = document.getElementById("console");
        const consoleTabEl = document.getElementById("consoleTab");
        const hintEl = document.getElementById("hint");
        const crosshairEl = document.getElementById("crosshair");

        /* ------- 移动端触控 (仅触屏设备; PC 走原有鼠标/键盘路径) ------- */
        const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        if (isTouch) document.body.classList.add("touch");

        const joyBaseEl = document.getElementById("joyBase");
        const joyKnobEl = document.getElementById("joyKnob");
        const btnFireEl = document.getElementById("btnFire");
        const btnJumpEl = document.getElementById("btnJump");
        const btnCrouchEl = document.getElementById("btnCrouch");

        const joyOrigin = { x: 0, y: 0 };
        const stick = { x: 0, y: 0 };
        const crouch = { on: false };
        const LOOK_TOUCH_SENS = 0.0045;
        let firing = false;
        let joyTouchId = null, lookTouchId = null, lookLast = null, lastTouchTime = 0;

        function inUi(el) {
            return !!(el && el.closest && el.closest(
                '#console, #telem, #stats, #killfeed, #hint, #hpwrap, #authority, #btnFire, #btnJump, #btnCrouch, #blocker, #chat'));
        }

        if (isTouch) {
            hintEl.textContent = "左摇杆 移动 · 右侧拖拽 瞄准 · FIRE 射击 · JUMP 跳跃";
            const bp = document.querySelector("#blocker p");
            if (bp) bp.textContent = "左半屏摇杆 移动 / 右侧拖拽 瞄准 / 开火 射击";
        }

        function setConn(state) {
            connDotEl.className = "dot " + state;
            const txt = { offline: "离线", connecting: "连接中", online: "已连接", error: "错误" }[state] || state;
            connStateEl.textContent = txt;
            connStateEl.style.color = state === "online" ? "var(--signal)" : state === "error" ? "var(--ember)" : "var(--steel)";
        }

        function setConsole(open) {
            consoleEl.classList.toggle("collapsed", !open);
            consoleTabEl.innerHTML = open ? "控制台 ▸" : "◂ 控制台";
            consoleTabEl.setAttribute("aria-expanded", String(open));
        }
        consoleTabEl.addEventListener("click", () => {
            setConsole(consoleEl.classList.contains("collapsed"));
        });

        /* ------- 漂移仪表 (签名元素) ------- */
        const driftCanvas = document.getElementById("driftCanvas");
        const driftCtx = driftCanvas.getContext("2d");
        const driftValEl = document.getElementById("driftVal");
        const toggleOthersEl = document.getElementById("toggleOthers");
        const othersWrapEl = document.getElementById("othersWrap");
        const driftBuf = [];
        let lastDrift = 0;
        let driftGood = true;
        let othersOpen = false;

        toggleOthersEl.addEventListener("click", () => {
            othersOpen = !othersOpen;
            othersWrapEl.classList.toggle("open", othersOpen);
        });

        function drawDrift() {
            const cw = driftCanvas.width, ch = driftCanvas.height;
            driftCtx.clearRect(0, 0, cw, ch);
            // 基线
            driftCtx.strokeStyle = "rgba(143,166,200,.18)";
            driftCtx.lineWidth = 1;
            driftCtx.beginPath();
            driftCtx.moveTo(0, ch - 4);
            driftCtx.lineTo(cw, ch - 4);
            driftCtx.stroke();
            if (!selfId || driftBuf.length === 0) {
                driftValEl.textContent = "—";
                driftValEl.className = "val";
                return;
            }
            const max = 20;
            const color = driftGood ? "#6fe9b0" : "#ffc857";
            const n = driftBuf.length;
            driftCtx.strokeStyle = color;
            driftCtx.lineWidth = 2;
            driftCtx.beginPath();
            for (let i = 0; i < n; i++) {
                const x = 2 + (i / 39) * (cw - 4);
                const y = ch - 4 - Math.min(driftBuf[i], max) / max * (ch - 10);
                i === 0 ? driftCtx.moveTo(x, y) : driftCtx.lineTo(x, y);
            }
            driftCtx.stroke();
            // 当前采样点
            const cx = 2 + ((n - 1) / 39) * (cw - 4);
            const cy = ch - 4 - Math.min(driftBuf[n - 1], max) / max * (ch - 10);
            driftCtx.beginPath();
            driftCtx.arc(cx, cy, 3, 0, Math.PI * 2);
            driftCtx.fillStyle = color;
            driftCtx.fill();
            driftValEl.textContent = lastDrift.toFixed(1);
            driftValEl.className = "val " + (driftGood ? "good" : "warn");
        }

        let ws = null;
        function sendInner(type, obj, cmd) {
            if (!ws || ws.readyState !== 1) return;
            const inner = type.encode(type.create(obj)).finish();
            const pkg = ProtoPackage.encode(ProtoPackage.create({ cmd, protocol: inner })).finish();
            ws.send(pkg);
            telemSeqEl.textContent = String(lastSeq);
        }

        function handlePkg(msg) {
            switch (msg.cmd) {
                case Cmd.PROTO_CMD_CS_RES_LOGIN: log("✓ 登录成功"); break;
                case Cmd.PROTO_CMD_CS_MAP3D_NOTIFY_INIT_DATA: {
                    const d = T_Init.decode(msg.protocol);
                    // 首次收到位置时检测坐标基准：服务器返回绝对坐标(约500000)则建立本地偏移。
                    // 注意: 玩家可能出生在环状防重叠偏移点上(不等于地图中心), 此处只是临时锚点,
                    // MAP_DATA 下发地图中心绝对坐标后会重新校准并平移已放置的位置。
                    if (!offsetReady && (Math.abs(d.x) > 10000 || Math.abs(d.z) > 10000)) {
                        coordOffset.x = d.x; coordOffset.z = d.z;
                        offsetReady = true;
                        log("✓ 坐标预校准(出生点锚点): (" + d.x + "," + d.z + ")→(0,0), 等待地图中心精确校准");
                    }
                    const sp = loc(d);
                    selfId = String(d.userId);
                    telemUserEl.textContent = selfId;
                    if (!players.has(selfId)) {
                        const p = createPlayerMesh(true, selfId);
                        players.set(selfId, p);
                    }
                    const me = players.get(selfId);
                    me.group.position.set(sp.x, sp.y, sp.z);
                    me.prevPos.set(sp.x, sp.y, sp.z);
                    me.targetPos.set(sp.x, sp.y, sp.z);
                    localPos.set(sp.x, sp.y, sp.z);
                    serverPos.set(sp.x, sp.y, sp.z);
                    break;
                }
                case Cmd.PROTO_CMD_CS_MAP3D_NOTIFY_STATE_DATA: {
                    const s = T_State.decode(msg.protocol);
                    document.getElementById("online").textContent = s.players.length;
                    telemOnlineEl.textContent = String(s.players.length);
                    const seen = new Set();
                    s.players.forEach(p => {
                        const pId = String(p.userId);
                        seen.add(pId);
                        let m = players.get(pId);
                        if (!m) {
                            m = createPlayerMesh(pId === selfId, pId);
                            players.set(pId, m);
                        }
                        const lp = loc(p);
                        m.targetPos.set(lp.x, lp.y, lp.z);
                        // 服务器已做权威墙体碰撞, 同步坐标不会穿墙, 直接使用
                        m.updateTime = performance.now();
                        if (pId === selfId) serverPos.set(lp.x, lp.y, lp.z);
                    });
                    players.forEach((m, id) => {
                        if (!seen.has(id) && id !== selfId) {
                            scene.remove(m.group);
                            players.delete(id);
                        }
                    });
                    break;
                }
                case Cmd.PROTO_CMD_CS_MAP3D_ENTER_RES: {
                    const r = T_EnterR.decode(msg.protocol);
                    telemMapEl.textContent = String(r.mapId);
                    setConsole(false);
                    document.getElementById("blocker").classList.remove("hidden");
                    chatEl.classList.remove("hidden"); // 进入房间后显示聊天
                    break;
                }
                case Cmd.PROTO_CMD_CS_MAP3D_NOTIFY_MAP_DATA: {
                    const d = T_MapData.decode(msg.protocol);
                    // 用服务器下发的地图中心绝对坐标精确校准本地原点。
                    // INIT_DATA 的锚点是玩家自己的出生点(环状防重叠, 可能偏离中心最多约14单位),
                    // 这里重新锚定到地图中心, 并按锚点差平移所有已放置的位置(人物/子弹), 保证与服务器坐标一致。
                    if (Math.abs(d.centerX) > 10000 || Math.abs(d.centerZ) > 10000) {
                        const dx = d.centerX - coordOffset.x;
                        const dz = d.centerZ - coordOffset.z;
                        coordOffset.x = d.centerX; coordOffset.z = d.centerZ;
                        offsetReady = true;
                        if (dx !== 0 || dz !== 0) {
                            const shift = (v) => { v.x -= dx; v.z -= dz; };
                            shift(localPos); shift(serverPos);
                            players.forEach(m => {
                                shift(m.group.position);
                                shift(m.prevPos);
                                shift(m.targetPos);
                            });
                            bullets.forEach(b => {
                                if (b.mesh) shift(b.mesh.position);
                                if (b.points) b.points.forEach(shift);
                            });
                            log("✓ 坐标校准(地图中心): (" + d.centerX + "," + d.centerZ + ")→(0,0), 平移已放置位置 (" + (-dx) + "," + (-dz) + ")");
                        }
                    }
                    buildMapFromServer(d);
                    break;
                }
                case Cmd.PROTO_CMD_CS_MAP3D_NOTIFY_BULLET: {
                    const b = T_Bullet.decode(msg.protocol);
                    const lb = loc(b);
                    b.x = lb.x; b.y = lb.y; b.z = lb.z;
                    handleBullet(b); break;
                }
                case Cmd.PROTO_CMD_CS_MAP3D_NOTIFY_BULLET_WALL_HIT: {
                    const w = T_WallHit.decode(msg.protocol);
                    console.log(w);
                    if (offsetReady) { w.x -= coordOffset.x; w.z -= coordOffset.z; }
                    // 权威碰撞点在服务器计算; 本机射击已有本地即时特效,
                    // 服务器碰撞点用于其他玩家视角的墙体火花
                    if (String(w.shooterId) !== selfId) createWallImpact(w.x, w.y, w.z);
                    break;
                }
                case Cmd.PROTO_CMD_CS_MAP3D_NOTIFY_HIT_PLAYER: {
                    const h = T_Hit.decode(msg.protocol);
                    if (offsetReady) { h.targetX -= coordOffset.x; h.targetZ -= coordOffset.z; }
                    killfeed(`你命中 ${h.targetId} → -${h.damage}HP`);
                    createHitEffect(h.targetX, h.targetY, h.targetZ);
                    break;
                }
                case Cmd.PROTO_CMD_CS_MAP3D_NOTIFY_PLAYER_HURT: {
                    const h = T_Hurt.decode(msg.protocol);
                    if (offsetReady) { h.x -= coordOffset.x; h.z -= coordOffset.z; }
                    const targetIdStr = String(h.targetId);
                    if (targetIdStr === selfId) {
                        myHp = h.hp; myMaxHp = h.maxHp;
                        updateHpUI(); flashDamage();
                        if (h.hp <= 0) { deaths++; document.getElementById("deaths").textContent = deaths; }
                    }
                    const pm = players.get(targetIdStr);
                    if (pm) showDamageNumber(h.x, h.y + 3, h.z, h.damage);
                    break;
                }
                case Cmd.PROTO_CMD_CS_RES_MAP3D_SHOOT: {
                    const r = T_ShootR.decode(msg.protocol);
                    if (r.damage > 0) { kills++; document.getElementById("kills").textContent = kills; }
                    break;
                }
                case Cmd.PROTO_CMD_CS_MAP3D_NOTIFY_CHAT: {
                    const c = T_ChatN.decode(msg.protocol);
                    addChatLine(String(c.senderId), String(c.message));
                    break;
                }
                case Cmd.PROTO_CMD_CS_RES_MAP3D_PONG: {
                    try {
                        const o = T_Pong.toObject(T_Pong.decode(msg.protocol), { longs: Number });
                        const rtt = Date.now() - Number(o.clientTime);
                        if (rtt >= 0 && rtt < 60000) {
                            telemRttEl.textContent = rtt + "ms";
                            telemRttEl.style.color = "var(--signal)";
                        }
                    } catch (e) { /* 服务器未实现 ping/pong 则忽略 */ }
                    break;
                }
            }
        }

        document.getElementById("btnConnect").onclick = () => {

        /* RTT 探测: 每 2.5s 发一次 3D ping (服务器未实现则显示 —) */
        setInterval(() => {

        /* ------- 房间文字聊天: T键 打开/关闭, Enter 发送, Esc 关闭 -------
           消息统一走服务器广播(PROTO_CMD_CS_MAP3D_NOTIFY_CHAT), 本机也回显, 不做本地echo */
        const chatEl = document.getElementById("chat");
        const chatLogEl = document.getElementById("chatLog");
        const chatInputEl = document.getElementById("chatInput");
        let chatOpen = false;
        const CHAT_MAX_LEN = 120;
        const CHAT_LINE_MAX = 60;

        function addChatLine(senderId, text) {
            const line = document.createElement("div");
            line.className = "chat-line " + (senderId === selfId ? "self" : "other");
            const cid = document.createElement("span");
            cid.className = "cid";
            cid.textContent = senderId;
            line.appendChild(cid);
            line.appendChild(document.createTextNode(text));
            chatLogEl.appendChild(line);
            while (chatLogEl.children.length > CHAT_LINE_MAX) chatLogEl.firstChild.remove();
            chatLogEl.scrollTop = chatLogEl.scrollHeight;
        }

        function openChat() {
            if (chatOpen || !selfId) return;
            chatOpen = true;
            if (document.pointerLockElement) document.exitPointerLock();
            setTimeout(() => chatInputEl.focus(), 60);
        }

        function closeChat() {
            if (!chatOpen) return;
            chatOpen = false;
            chatInputEl.value = "";
            chatInputEl.blur();
            // 恢复第一人称锁定提示 (与 ESC 释放锁后的行为一致)
            if (ws && ws.readyState === 1) blocker.classList.remove("hidden");
            hintEl.classList.remove("hide");
        }

        function sendChat() {
            const text = chatInputEl.value.trim();
            if (!text) return;
            sendInner(T_Chat, { message: text.slice(0, CHAT_MAX_LEN) }, Cmd.PROTO_CMD_CS_REQ_MAP3D_CHAT);
            chatInputEl.value = "";
            chatInputEl.focus();
        }

        chatInputEl.addEventListener("keydown", e => {
            e.stopPropagation(); // 打字时不触发游戏按键
            if (e.key === "Enter") { e.preventDefault(); sendChat(); }
            else if (e.key === "Escape") { e.preventDefault(); closeChat(); }
        });
        chatInputEl.addEventListener("blur", () => { if (chatOpen) closeChat(); });
        // 阻止点"发送"时输入框失焦(失焦会关闭聊天并清空输入), 保证click能取到内容
        document.getElementById("chatSend").addEventListener("pointerdown", e => e.preventDefault());

        /* ---------------- Three.js 场景 ---------------- */

        function makeGroundTexture() {
            const c = document.createElement("canvas"); c.width = c.height = 512;
            const g = c.getContext("2d");
            g.fillStyle = "#0e1a2e"; g.fillRect(0, 0, 512, 512);
            g.strokeStyle = "#1a2f4e"; g.lineWidth = 2;
            for (let i = 0; i <= 512; i += 64) {
                g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 512); g.stroke();
                g.beginPath(); g.moveTo(0, i); g.lineTo(512, i); g.stroke();
            }
            const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;
            t.repeat.set(40, 40); return t;
        }

        /* ============================================================
           地图: 由服务器下发配置构建 (PROTO_CMD_CS_MAP3D_NOTIFY_MAP_DATA)
           墙体/建筑唯一数据源是服务器 Lua 配置 (lua/Map/Map3DMapConfig.lua),
           权威碰撞(人物/子弹 vs 墙体)在服务器执行;
           客户端用同一份盒数据渲染地图, 并做本地移动预测
           ============================================================ */
        const obstacles = [];                 // 参与碰撞的 AABB 盒
        const obstacleMeshes = [];            // 参与射线检测的网格(射击/遮挡)
        let mapMeshes = [];                   // 地图网格(重建地图时清理)
        let mapName = "";

        function addBox(x, yRel, z, w, h, d, color, collide = true) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
                new THREE.MeshStandardMaterial({ color, roughness: 0.82, metalness: 0.05 }));
            m.position.set(x, GROUND_Y + yRel, z);
            m.castShadow = true; m.receiveShadow = true;
            scene.add(m);
            mapMeshes.push(m);
            if (collide) {
                obstacles.push({ mesh: m, half: new THREE.Vector3(w / 2, h / 2, d / 2) });
                obstacleMeshes.push(m);
            }
            return m;
        }

        const MAP_DATA_SCALE = 1000;          // 服务器坐标缩放: 本地单位×1000
        function buildMapFromServer(data) {
            console.log(data);
            // 清理旧地图
            for (const m of mapMeshes) scene.remove(m);
            mapMeshes = [];
            obstacles.length = 0;
            obstacleMeshes.length = 0;

            mapName = data.name;
            if (data.groundY) {
                GROUND_Y = data.groundY;      // 地面高度以服务器为准
                ground.position.y = GROUND_Y;
                gridHelper.position.y = GROUND_Y;
                sun.position.y = GROUND_Y + 120;
                sunTarget.position.y = GROUND_Y;
            }

            for (const b of data.boxes) {
                addBox(b.x / MAP_DATA_SCALE, b.y / MAP_DATA_SCALE, b.z / MAP_DATA_SCALE,
                    b.w / MAP_DATA_SCALE, b.h / MAP_DATA_SCALE, b.d / MAP_DATA_SCALE,
                    b.color, b.collide);
            }
            log("✓ 地图配置已下发: " + mapName + " 盒数=" + data.boxes.length + " (地面Y=" + GROUND_Y + ")");
        }

        const gridHelper = new THREE.GridHelper(400, 80, 0x1a3a5c, 0x0f243f);
        gridHelper.position.y = GROUND_Y;
        scene.add(gridHelper);

        const viewModel = new THREE.Group();
        camera.add(viewModel);
        scene.add(camera);

        const gunMat = new THREE.MeshStandardMaterial({ color: 0x222831, roughness: 0.5, metalness: 0.7 });
        const gunMat2 = new THREE.MeshStandardMaterial({ color: 0x11151c, roughness: 0.6, metalness: 0.6 });
        const gunMat3 = new THREE.MeshStandardMaterial({ color: 0x3a3f4a, roughness: 0.4, metalness: 0.8 });

        const body = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, 0.5), gunMat);
        body.position.set(0, -0.05, -0.35); viewModel.add(body);
        const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.45, 12), gunMat2);
        barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.02, -0.65); viewModel.add(barrel);
        const grip = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.18, 0.12), gunMat);
        grip.position.set(0, -0.16, -0.18); grip.rotation.x = 0.3; viewModel.add(grip);
        const mag = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.16, 0.1), gunMat3);
        mag.position.set(0, -0.14, -0.32); viewModel.add(mag);
        const sight = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.05, 0.08), gunMat2);
        sight.position.set(0, 0.08, -0.35); viewModel.add(sight);
        const muzzle = new THREE.Object3D();
        muzzle.position.set(0, 0.02, -0.9); viewModel.add(muzzle);

        const flashMat = new THREE.MeshBasicMaterial({ color: 0xffdd66, transparent: true, opacity: 0 });
        const flash = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), flashMat);
        flash.position.copy(muzzle.position); viewModel.add(flash);
        let flashTime = 0;
        viewModel.position.set(0.18, -0.18, 0);

        function createPlayerMesh(isSelf, id) {
            const group = new THREE.Group();
            const pBody = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 1.0, 6, 12),
                new THREE.MeshStandardMaterial({ color: isSelf ? 0x20c997 : 0x3aa0ff, emissive: isSelf ? 0x0a4d3a : 0x1a5080, emissiveIntensity: 0.25, roughness: 0.6 }));
            pBody.position.y = 1.1; pBody.castShadow = true;
            group.add(pBody);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0xf0c090, roughness: 0.7 }));
            head.position.y = 2.0; head.castShadow = true;
            group.add(head);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const e1 = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), eyeMat);
            e1.position.set(-0.12, 2.05, 0.3); group.add(e1);
            const e2 = e1.clone(); e2.position.x = 0.12; group.add(e2);
            const armMat = new THREE.MeshStandardMaterial({ color: isSelf ? 0x169970 : 0x2a7ad0, roughness: 0.6 });
            const larm = new THREE.Mesh(new THREE.CapsuleGeometry(0.15, 0.8, 4, 8), armMat);
            larm.position.set(-0.65, 1.2, 0); larm.castShadow = true; group.add(larm);
            const rarm = larm.clone(); rarm.position.x = 0.65; group.add(rarm);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x1a2540, roughness: 0.7 });
            const lleg = new THREE.Mesh(new THREE.CapsuleGeometry(0.18, 0.7, 4, 8), legMat);
            lleg.position.set(-0.22, 0.45, 0); lleg.castShadow = true; group.add(lleg);
            const rleg = lleg.clone(); rleg.position.x = 0.22; group.add(rleg);
            const pgun = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, 0.5),
                new THREE.MeshStandardMaterial({ color: 0x222831, metalness: 0.6, roughness: 0.5 }));
            pgun.position.set(0.5, 1.2, -0.25); group.add(pgun);

            label.position.y = 2.6; group.add(label);
