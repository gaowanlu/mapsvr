<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <title>3D 地图客户端 - 第一人称视角</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #050b16;
            color: #e6edf3;
            font-family: system-ui, -apple-system, "Microsoft YaHei";
        }

        #ui {
            position: fixed;
            top: 12px;
            left: 12px;
            width: 300px;
            background: rgba(5, 15, 30, .85);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 8px;
            padding: 10px;
            z-index: 100;
        }

        input,
        button {
            width: 100%;
            margin-top: 6px;
            padding: 6px;
            background: #0b1a2c;
            border: 1px solid rgba(255, 255, 255, .08);
            color: #e6edf3;
            border-radius: 6px;
        }

        button {
            cursor: pointer;
        }

        button:hover {
            background: #0f2540;
        }

        #shootBtn {
            background: #e63946;
            border: 1px solid #ff6b6b;
            font-weight: bold;
        }

        #shootBtn:hover {
            background: #d62839;
        }

        pre {
            margin-top: 8px;
            font-size: 11px;
            max-height: 160px;
            overflow: auto;
            background: #020814;
            padding: 6px;
        }

        #controls-hint {
            position: fixed;
            bottom: 12px;
            left: 12px;
            background: rgba(5, 15, 30, .85);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
        }

        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 1000;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }

        #crosshair::before {
            left: 50%;
            top: 0;
            width: 2px;
            height: 100%;
            transform: translateX(-50%);
        }

        #crosshair::after {
            top: 50%;
            left: 0;
            height: 2px;
            width: 100%;
            transform: translateY(-50%);
        }

        #pointer-lock-hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 15, 30, .95);
            border: 2px solid rgba(255, 255, 255, .2);
            border-radius: 12px;
            padding: 30px;
            font-size: 16px;
            text-align: center;
            z-index: 999;
            display: none;
        }
    </style>
</head>

<body>

    <div id="ui">
        <input id="wsUrl" value="ws://127.0.0.1:20026">
        <input id="userId" value="1">
        <input id="password" value="1">
        <button id="btnConnect">连接</button>
        <button id="btnLogin">登录</button>
        <button id="btnEnter">进入3D地图</button>
        <button id="btnCreateUser">注册账号</button>
        <button id="shootBtn" style="display:none;">🔫 射击 (点击)</button>
        <pre id="log">未连接</pre>
    </div>

    <div id="controls-hint">
        <strong>第一人称控制：</strong><br>
        W/S/A/D - 前后左右移动<br>
        Space - 上升 | Shift - 下降<br>
        鼠标移动 - 旋转视角<br>
        ESC - 解锁鼠标<br>
        <span style="color: #20c997;">点击画面锁定鼠标</span>
    </div>

    <div id="crosshair"></div>

    <div id="pointer-lock-hint">
        <div style="font-size: 24px; margin-bottom: 15px;">🎮</div>
        <div>点击画面进入第一人称模式</div>
        <div style="font-size: 12px; margin-top: 10px; opacity: 0.7;">按 ESC 退出</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.5/dist/protobuf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>

    <script>
        // ===================== Proto =====================
        const protoText = `
syntax="proto3";
package avant;
enum ProtoCmd{
    // 样例请求
    PROTO_CMD_CS_REQ_EXAMPLE = 0;
    // 样例返回
    PROTO_CMD_CS_RES_EXAMPLE = 1;
    // 主线程通知worker线程新的客户端文件描述符
    PROTO_CMD_TUNNEL_MAIN2WORKER_NEW_CLIENT = 2;
    // 线程之间通信封装包
    PROTO_CMD_TUNNEL_PACKAGE = 3;
    // 线程之间客户端转发数据
    PROTO_CMD_TUNNEL_CLIENT_FORWARD_MESSAGE = 4;
    // websocket转发数据给所有客户端
    PROTO_CMD_TUNNEL_WEBSOCKET_BROADCAST = 5;
    // worker线程通知other线程有新的客户端连接
    PROTO_CMD_TUNNEL_WORKER2OTHER_EVENT_NEW_CLIENT_CONNECTION = 6;
    // other线程向worker发消息样例
    PROTO_CMD_TUNNEL_OTHER2WORKER_TEST = 7;
    // lua与c++通信样例
    PROTO_CMD_LUA_TEST = 8;
    // 进程间通信握手协议
    PROTO_CMD_IPC_STREAM_AUTH_HANDSHAKE = 9;
    // worker发消息到other的lua虚拟机
    PROTO_CMD_TUNNEL_WORKER2OTHER_LUAVM = 10;
    // other线程虚拟机发消息给worker内的客户端连接
    PROTO_CMD_TUNNEL_OTHERLUAVM2WORKERCONN = 11;
    // worker线程通知other线程有客户端断开连接
    PROTO_CMD_TUNNEL_WORKER2OTHER_EVENT_CLOSE_CLIENT_CONNECTION = 12;
    // other线程通知worker线程把某个客户端连接主动断开
    PROTO_CMD_TUNNEL_OTHERLUAVM2WORKER_CLOSE_CLIENT_CONNECTION = 13;
    // 优雅停服请求
    PROTO_CMD_UDP_SAFESTOP_REQ = 14;
    // 优雅停服返回
    PROTO_CMD_UDP_SAFESTOP_RES = 15;

    // 登录请求
    PROTO_CMD_CS_REQ_LOGIN = 2001;
    // 登录返回
    PROTO_CMD_CS_RES_LOGIN = 2002;
    // Map2D下发初始化数据
    PROTO_CMD_CS_MAP_NOTIFY_INIT_DATA = 2003;
    // Map2D客户端向地图心跳请求
    PROTO_CMD_CS_REQ_MAP_PING = 2004;
    // Map2D客户端向地图心跳返回
    PROTO_CMD_CS_RES_MAP_PONG = 2005;
    // Map2D客户端输入请求
    PROTO_CMD_CS_REQ_MAP_INPUT = 2006;
    // Map2D服务器同步给玩家状态
    PROTO_CMD_CS_MAP_NOTIFY_STATE_DATA = 2007;
    // Map2D进入地图请求
    PROTO_CMD_CS_MAP_ENTER_REQ = 2008;
    // Map2D进入地图返回
    PROTO_CMD_CS_MAP_ENTER_RES = 2009;
    // Map2D离开地图请求
    PROTO_CMD_CS_MAP_LEAVE_REQ = 2010;
    // Map2D离开地图返回
    PROTO_CMD_CS_MAP_LEAVE_RES = 2011;

    // Map3D下发初始化数据
    PROTO_CMD_CS_MAP3D_NOTIFY_INIT_DATA = 2012;
    // Map3D客户端向地图心跳请求
    PROTO_CMD_CS_REQ_MAP3D_PING = 2013;
    // Map3D客户端向地图心跳返回
    PROTO_CMD_CS_RES_MAP3D_PONG = 2014;
    // Map3D客户端输入请求
    PROTO_CMD_CS_REQ_MAP3D_INPUT = 2015;
    // Map3D服务器同步给玩家状态
    PROTO_CMD_CS_MAP3D_NOTIFY_STATE_DATA = 2016;
    // Map3D进入地图请求
    PROTO_CMD_CS_MAP3D_ENTER_REQ = 2017;
    // Map3D进入地图返回
    PROTO_CMD_CS_MAP3D_ENTER_RES = 2018;
    // Map3D离开地图请求
    PROTO_CMD_CS_MAP3D_LEAVE_REQ = 2019;
    // Map3D离开地图返回
    PROTO_CMD_CS_MAP3D_LEAVE_RES = 2020;

    // Map3D射击请求
    PROTO_CMD_CS_REQ_MAP3D_SHOOT = 2021;
    // Map3D射击返回
    PROTO_CMD_CS_RES_MAP3D_SHOOT = 2022;
    // Map3D子弹状态同步
    PROTO_CMD_CS_MAP3D_NOTIFY_BULLET = 2023;
    // Map3D击中玩家通知
    PROTO_CMD_CS_MAP3D_NOTIFY_HIT_PLAYER = 2024;
    // Map3D玩家受伤通知
    PROTO_CMD_CS_MAP3D_NOTIFY_PLAYER_HURT = 2025;

    // 写dbuserreocord表数据
    PROTO_CMD_DBSVRGO_WRITE_DBUSERRECORD_REQ = 3000;
    // 检索dbuserrecord表请求
    PROTO_CMD_DBSVRGO_SELECT_DBUSERRECORD_REQ = 3001;
    // 检索dbuserrecord表返回
    PROTO_CMD_DBSVRGO_SELECT_DBUSERRECORD_RES = 3002;

    // 创建用户请求
    PROTO_CMD_CS_REQ_CREATE_USER = 3003;
    // 创建用户返回
    PROTO_CMD_CS_RES_CREATE_USER = 3004;
    // 插入dbuserreocrd数据请求
    PROTO_CMD_DBSVRGO_INSERT_DBUSERRECORD_REQ = 3005;
    // 插入dbuserreocrd数据返回
    PROTO_CMD_DBSVRGO_INSERT_DBUSERRECORD_RES = 3006;
    // 登录时检索dbuserrecord请求
    PROTO_CMD_DBSVRGO_SELECT_DBUSERRECORD_LOGIN_REQ = 3007;
    // 登录时检索dbuserrecord返回
    PROTO_CMD_DBSVRGO_SELECT_DBUSERRECORD_LOGIN_RES = 3008;
}
message ProtoPackage{
  ProtoCmd cmd=1;
  bytes protocol=2;
}
message ProtoCSReqLogin{
  string userId=1;
  string password=2;
}
message ProtoCSMap3DNotifyInitData{
  string userId=1;
  int32 x=2;
  int32 y=3;
  int32 z=10;
}
message ProtoCSReqMap3DInput{
  int32 dirX=1;
  int32 dirY=2;
  int32 dirZ=3;
  uint32 seq=4;
  uint64 clientTime=5;
}
message ProtoMap3DPlayerPayload{
  string userId=1;
  int32 x=2;
  int32 y=3;
  int32 z=4;
  uint32 lastSeq=8;
}
message ProtoCSMap3DNotifyStateData{
  repeated ProtoMap3DPlayerPayload players=2;
}
message ProtoCSMap3DEnterReq{
  uint32 mapId=1;
}
message ProtoCSMap3DEnterRes{
  int32 ret=1;
  uint32 mapId=2;
}

// PROTO_CMD_CS_REQ_CREATE_USER 创建新账号请求
message ProtoCSReqCreateUser
{
    string userId=1;
    string password=2;
}

// PROTO_CMD_CS_RES_CREATE_USER 创建新账号返回
message ProtoCSResCreateUser
{
    int32 ret=1;
    string userId=2;
    string password=3;
    uint64 userRecordID=4;
}



// Map3D射击请求
message ProtoCSReqMap3DShoot{
  string shooterId=1;
  int32 dirX=2;   // 子弹方向向量X分量（客户端计算并归一化）
  int32 dirY=3;   // 子弹方向向量Y分量
  int32 dirZ=4;   // 子弹方向向量Z分量
  int32 shootDist=5;  // 射击距离（像素单位）
  uint64 clientTime=6;
}

// Map3D射击返回
message ProtoCSResMap3DShoot{
  int32 ret=1;
  int32 damage=2;
}

// Map3D子弹状态同步
message ProtoCSMap3DNotifyBullet{
  string bulletId=1;
  string shooterId=2;
  int32 x=3;
  int32 y=4;
  int32 z=5;
  int32 dirX=6;
  int32 dirY=7;
  int32 dirZ=8;
  uint64 lifeTime=9;
  uint64 spawnTime=10;
}

// Map3D击中玩家通知
message ProtoCSMap3DNotifyHitPlayer{
  string bulletId=1;
  string targetId=2;
  int32 damage=3;
  int32 targetX=4;
  int32 targetY=5;
  int32 targetZ=6;
}

// Map3D玩家受伤通知
message ProtoCSMap3DNotifyPlayerHurt{
  string targetId=1;
  int32 hp=2;
  int32 maxHp=3;
  int32 damage=4;
  int32 x=5;
  int32 y=6;
  int32 z=7;
}


`;

        const root = protobuf.parse(protoText).root;
        const ProtoPackage = root.lookupType("avant.ProtoPackage");
        const Cmd = root.lookupEnum("avant.ProtoCmd").values;
        const T_Login = root.lookupType("avant.ProtoCSReqLogin");
        const T_Init = root.lookupType("avant.ProtoCSMap3DNotifyInitData");
        const T_State = root.lookupType("avant.ProtoCSMap3DNotifyStateData");
        const T_Input = root.lookupType("avant.ProtoCSReqMap3DInput");
        const T_Enter = root.lookupType("avant.ProtoCSMap3DEnterReq");
        const T_ProtoCSReqCreateUser = root.lookupType("avant.ProtoCSReqCreateUser");
        const T_ProtoCSResCreateUser = root.lookupType("avant.ProtoCSResCreateUser");
        const T_Shoot = root.lookupType("avant.ProtoCSReqMap3DShoot");
        const T_ShootRes = root.lookupType("avant.ProtoCSResMap3DShoot");
        const SHOOT_DIST = 50; // 射击距离（像素单位）

        const T_ProtoCSMap3DNotifyBullet = root.lookupType("avant.ProtoCSMap3DNotifyBullet");
        const T_ProtoCSMap3DNotifyHitPlayer = root.lookupType("avant.ProtoCSMap3DNotifyHitPlayer");
        const T_ProtoCSMap3DNotifyPlayerHurt = root.lookupType("avant.ProtoCSMap3DNotifyPlayerHurt")

        // ===================== Map State =====================
        const players = new Map();
        const bullets = new Map();
        let selfId = null;
        let lastSeq = 0;

        // ===================== UI / Log =====================
        const logEl = document.getElementById("log");
        function log(...a) {
            logEl.textContent =
                new Date().toLocaleTimeString() + " " + a.join(" ") + "\n" + logEl.textContent;
            if (logEl.textContent.length > 3000) {
                logEl.textContent = "";
            }
        }

        // ===================== WebSocket =====================
        let ws = null;
        function sendInner(type, obj, cmd) {
            if (!ws || ws.readyState !== 1) {
                log("WebSocket 未连接");
                return;
            }
            const inner = type.encode(type.create(obj)).finish();
            const pkg = ProtoPackage.encode(
                ProtoPackage.create({ cmd, protocol: inner })
            ).finish();
            ws.send(pkg);
        }

        // ===================== WebSocket Handler =====================
        function handlePkg(msg) {
            switch (msg.cmd) {
                case Cmd.PROTO_CMD_CS_RES_LOGIN:
                    log("✓ 登录成功");
                    break;
                case Cmd.PROTO_CMD_CS_MAP3D_NOTIFY_INIT_DATA:
                    const initData = T_Init.decode(msg.protocol);
                    selfId = initData.userId;
                    if (!players.has(selfId)) {
                        const mesh = createPlayerMesh(true);
                        mesh.position.set(initData.x, initData.y, initData.z);
                        players.set(selfId, mesh);
                    }
                    log("✓ 初始化玩家:", selfId, `位置:(${initData.x},${initData.y},${initData.z})`);
                    break;
                case Cmd.PROTO_CMD_CS_MAP3D_NOTIFY_STATE_DATA:
                    const stateData = T_State.decode(msg.protocol);
                    log(`AOI玩家个数 ${stateData.players.length}`);
                    let playersPos = "";
                    stateData.players.forEach(p => {
                        let m = players.get(p.userId);
                        if (!m) {
                            m = createPlayerMesh(p.userId === selfId);
                            players.set(p.userId, m);
                            log("新玩家加入:", p.userId);
                        }
                        m.position.set(p.x, p.y, p.z);
                        playersPos += `{${p.x},${p.y},${p.z}}`;
                    });
                    log(playersPos);
                    break;
                case Cmd.PROTO_CMD_CS_MAP3D_ENTER_RES:
                    log("✓ 进入3D地图成功");
                    showPointerLockHint();
                    document.getElementById("shootBtn").style.display = "inline-block";
                    break;
                case Cmd.PROTO_CMD_CS_RES_CREATE_USER:
                    try {
                        const resCreateUser = T_ProtoCSResCreateUser.decode(msg.protocol);
                        const createUserObj = T_ProtoCSResCreateUser.toObject(resCreateUser, { longs: String });
                        log(`PROTO_CMD_CS_RES_CREATE_USER ${JSON.stringify(createUserObj)}`);
                    } catch (e) { log('decode login err', e.message); }
                    break;
                case Cmd.PROTO_CMD_CS_MAP3D_NOTIFY_BULLET:
                    const bulletData = T_ProtoCSMap3DNotifyBullet.decode(msg.protocol);
                    handleBullet(bulletData);
                    break;
                case Cmd.PROTO_CMD_CS_MAP3D_NOTIFY_HIT_PLAYER:
                    const hitData = T_ProtoCSMap3DNotifyHitPlayer.decode(msg.protocol);
                    handleHitPlayer(hitData);
                    break;
                case Cmd.PROTO_CMD_CS_MAP3D_NOTIFY_PLAYER_HURT:
                    const hurtData = T_ProtoCSMap3DNotifyPlayerHurt.decode(msg.protocol);
                    handlePlayerHurt(hurtData);
                    break;
                case Cmd.PROTO_CMD_CS_RES_MAP3D_SHOOT:
                    const shootRes = T_ShootRes.decode(msg.protocol);
                    log(`🔫 射击返回: ${JSON.stringify(T_ShootRes.toObject(shootRes, { longs: String }))}`);
                    break;
                default:
                    log("未处理协议:", msg.cmd);
            }
        }

        // ===================== Bullet Management =====================
        function createBulletMesh(isNew) {
            const geometry = new THREE.SphereGeometry(0.5, 8, 8);
            const material = new THREE.MeshBasicMaterial({
                color: 0xffff00,
                transparent: true,
                opacity: isNew ? 1 : 0.7
            });
            const m = new THREE.Mesh(geometry, material);
            m.userData.arrowHelper = null;
            m.userData.trailLine = null;
            m.userData.trailPoints = [];
            scene.add(m);
            return m;
        }

        function handleBullet(bulletData) {
            console.log("收到子弹数据:", bulletData);
            let bullet = bullets.get(bulletData.bulletId);
            if (!bullet) {
                bullet = createBulletMesh(true);
                bullets.set(bulletData.bulletId, bullet);
            }

            // 将绝对坐标转换为 Three.js 场景坐标
            // 服务器发送的是绝对坐标 (bulletData.x/y/z)，需要转换
            const position = new THREE.Vector3(bulletData.x, bulletData.y, bulletData.z);
            bullet.position.copy(position);

            // 保存子弹生成时间（用于清理）
            bullet.userData.spawnTime = bulletData.spawnTime || Date.now();

            // 计算子弹方向向量（用于可视化）
            const dirLen = Math.sqrt(bulletData.dirX * bulletData.dirX +
                                    bulletData.dirY * bulletData.dirY +
                                    bulletData.dirZ * bulletData.dirZ);
            if (dirLen > 0.0001) {
                // 显示方向指示线
                if (!bullet.userData.arrowHelper) {
                    const dir = new THREE.Vector3(
                        bulletData.dirX / dirLen,
                        bulletData.dirY / dirLen,
                        bulletData.dirZ / dirLen
                    );
                    bullet.userData.arrowHelper = new THREE.ArrowHelper(
                        dir,
                        bullet.position,
                        10,
                        0xffff00
                    );
                    scene.add(bullet.userData.arrowHelper);
                } else {
                    bullet.userData.arrowHelper.position.copy(bullet.position);
                    bullet.userData.arrowHelper.setDirection(new THREE.Vector3(
                        bulletData.dirX / dirLen,
                        bulletData.dirY / dirLen,
                        bulletData.dirZ / dirLen
                    ));
                }
            }

            // 更新子弹轨迹线
            updateBulletTrail(bullet, position);
        }

        function updateBulletTrail(bullet, position) {
            // 保存轨迹点
            bullet.userData.trailPoints.push(position.clone());

            // 不限制轨迹点的数量，保留所有历史轨迹
            // const maxTrailPoints = 50;
            // if (bullet.userData.trailPoints.length > maxTrailPoints) {
            //     bullet.userData.trailPoints.shift();
            // }

            // 创建或更新轨迹线
            if (bullet.userData.trailPoints.length < 2) {
                // 点数不足，不需要显示轨迹
                if (bullet.userData.trailLine) {
                    scene.remove(bullet.userData.trailLine);
                    bullet.userData.trailLine = null;
                }
                return;
            }

            if (!bullet.userData.trailLine) {
                // 创建新的轨迹线
                const geometry = new THREE.BufferGeometry().setFromPoints(
                    bullet.userData.trailPoints
                );
                const material = new THREE.LineBasicMaterial({
                    color: 0x00ff00,
                    transparent: true,
                    opacity: 0.6,
                    linewidth: 3  // 增加线宽（WebGL 中可能不生效，但设置一下）
                });
                bullet.userData.trailLine = new THREE.Line(geometry, material);
                scene.add(bullet.userData.trailLine);
            } else {
                // 更新现有轨迹线的顶点
                bullet.userData.trailLine.geometry.setFromPoints(
                    bullet.userData.trailPoints
                );
                bullet.userData.trailLine.geometry.attributes.position.needsUpdate = true;
            }
        }

        function cleanupBullet(bulletId) {
            const bullet = bullets.get(bulletId);
            if (!bullet) return;

            // 移除轨迹线
            if (bullet.userData.trailLine) {
                scene.remove(bullet.userData.trailLine);
                bullet.userData.trailLine = null;
            }

            // 移除方向指示线
            if (bullet.userData.arrowHelper) {
                scene.remove(bullet.userData.arrowHelper);
                bullet.userData.arrowHelper = null;
            }

            // 移除子弹网格
            scene.remove(bullet);
            bullets.delete(bulletId);
        }

        function handleHitPlayer(hitData) {
            log(`💥 击中玩家 ${hitData.targetId}，造成 ${hitData.damage} 点伤害`);
            console.log(`💥 击中玩家 ${hitData.targetId}，造成 ${hitData.damage} 点伤害`);
            // 在击中位置显示特效
            createHitEffect(hitData.targetX, hitData.targetY, hitData.targetZ);
            // 不再清理子弹及其轨迹，保留所有历史轨迹
            // cleanupBullet(hitData.bulletId);
        }

        function createHitEffect(x, y, z) {
            // 创建简单的爆炸效果
            const geometry = new THREE.RingGeometry(0.5, 2, 16);
            const material = new THREE.MeshBasicMaterial({
                color: 0xff0000,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.8
            });
            const ring = new THREE.Mesh(geometry, material);
            ring.position.set(x, y, z);
            ring.lookAt(0, 1, 0);
            scene.add(ring);

            // 简单的淡出动画
            let opacity = 0.8;
            const animate = () => {
                opacity -= 0.05;
                ring.material.opacity = opacity;
                ring.scale.multiplyScalar(1.1);
                if (opacity > 0) {
                    requestAnimationFrame(animate);
                } else {
                    scene.remove(ring);
                }
            };
            animate();
        }

        function handlePlayerHurt(hurtData) {
            const player = players.get(hurtData.targetId);
            if (player) {
                // 可以在这里添加受伤视觉效果
                log(`⚠️ 玩家 ${hurtData.targetId} 受到 ${hurtData.damage} 点伤害，当前血量: ${hurtData.hp}/${hurtData.maxHp}`);
                console.log(`⚠️ 玩家 ${hurtData.targetId} 受到 ${hurtData.damage} 点伤害，当前血量: ${hurtData.hp}/${hurtData.maxHp}`);
            }
        }

        document.getElementById("btnConnect").onclick = () => {
            if (ws && ws.readyState === 1) {
                log("已经连接");
                return;
            }
            ws = new WebSocket(document.getElementById("wsUrl").value);
            ws.binaryType = "arraybuffer";
            ws.onopen = () => log("✓ WS 已连接");
            ws.onclose = () => log("✗ WS 断开");
            ws.onerror = (e) => log("✗ WS 错误");
            ws.onmessage = ev => {
                const msg = ProtoPackage.decode(new Uint8Array(ev.data));
                handlePkg(msg);
            };
        };

        document.getElementById("btnLogin").onclick = () => {
            sendInner(
                T_Login,
                { userId: document.getElementById("userId").value, password: document.getElementById("password").value },
                Cmd.PROTO_CMD_CS_REQ_LOGIN
            );
            log("发送登录请求");
        };

        document.getElementById("btnEnter").onclick = () => {
            sendInner(
                T_Enter,
                { mapId: 4 },
                Cmd.PROTO_CMD_CS_MAP3D_ENTER_REQ
            );
            log("请求进入地图");
        };

        document.getElementById("btnCreateUser").onclick = () => {
            sendInner(
                T_ProtoCSReqCreateUser,
                {
                    userId: document.getElementById("userId").value,
                    password: document.getElementById("password").value
                },
                Cmd.PROTO_CMD_CS_REQ_CREATE_USER
            );
            log("发送注册账号请求");
        };

        // 射击功能
        function shoot() {
            if (!selfId) return;

            // 获取玩家当前位置
            const self = players.get(selfId);
            if (!self) return;

            // 获取相机的前方向量（包含 yaw 和 pitch）
            const cameraDir = new THREE.Vector3();
            camera.getWorldDirection(cameraDir);

            // 转换为整数精度
            const dirXn = Math.round(cameraDir.x * 10000);
            const dirYn = Math.round(cameraDir.y * 10000);
            const dirZn = Math.round(cameraDir.z * 10000);

            log(`射击方向: (${dirXn}, ${dirYn}, ${dirZn})`);

            // 发送射击请求（发送方向向量和射击距离）
            sendInner(
                T_Shoot,
                {
                    shooterId: selfId,
                    dirX: dirXn,
                    dirY: dirYn,
                    dirZ: dirZn,
                    shootDist: SHOOT_DIST,
                    clientTime: Date.now()
                },
                Cmd.PROTO_CMD_CS_REQ_MAP3D_SHOOT
            );
            log("🔫 发射子弹！");
        }

        // 射击按钮事件
        document.getElementById("shootBtn").onclick = shoot;

        // ===================== Three.js =====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b16);
        scene.fog = new THREE.Fog(0x050b16, 100, 500);

        const camera = new THREE.PerspectiveCamera(
            75, window.innerWidth / window.innerHeight, 0.1, 1000
        );

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 添加网格辅助线
        const gridHelper = new THREE.GridHelper(2000, 100, 0x1a3a5c, 0x0f243f);
        scene.add(gridHelper);

        // 添加坐标轴辅助线
        const axesHelper = new THREE.AxesHelper(50);
        scene.add(axesHelper);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dl = new THREE.DirectionalLight(0xffffff, 0.6);
        dl.position.set(50, 50, 100);
        scene.add(dl);

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(2000, 2000),
            new THREE.MeshStandardMaterial({ color: 0x0f243f, transparent: true, opacity: 0.3 })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // ===================== 第一人称相机控制 =====================
        let yaw = 0;   // 水平旋转角度
        let pitch = 0; // 垂直旋转角度
        const EYE_HEIGHT = 1.6; // 眼睛高度（相对于玩家位置）

        // 窗口大小自适应
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ===================== 指针锁定 =====================
        const pointerLockHint = document.getElementById('pointer-lock-hint');

        function showPointerLockHint() {
            pointerLockHint.style.display = 'block';
        }

        // 射击冷却时间（毫秒）
        let lastShootTime = 0;
        const SHOOT_COOLDOWN = 200;

        renderer.domElement.addEventListener('click', () => {
            // 如果已锁定鼠标，执行射击；否则请求锁定
            if (document.pointerLockElement === renderer.domElement) {
                const now = Date.now();
                if (now - lastShootTime > SHOOT_COOLDOWN) {
                    shoot();
                    lastShootTime = now;
                }
            } else {
                renderer.domElement.requestPointerLock();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === renderer.domElement) {
                pointerLockHint.style.display = 'none';
                log("✓ 鼠标已锁定 - 第一人称模式");
            } else {
                log("鼠标已解锁");
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                const sensitivity = 0.002;
                yaw -= e.movementX * sensitivity;
                pitch -= e.movementY * sensitivity;

                // 限制俯仰角度，防止翻转
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
            }
        });

        // ===================== Player Mesh Creation =====================
        function createPlayerMesh(isSelf) {
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const material = new THREE.MeshStandardMaterial({
                color: isSelf ? 0x20c997 : 0x3aa0ff,
                emissive: isSelf ? 0x0a4d3a : 0x1a5080,
                emissiveIntensity: 0.3
            });
            const m = new THREE.Mesh(geometry, material);

            // 添加边框
            const edges = new THREE.EdgesGeometry(geometry);
            const line = new THREE.LineSegments(
                edges,
                new THREE.LineBasicMaterial({ color: isSelf ? 0x40ffbf : 0x60c0ff })
            );
            m.add(line);

            // 第一人称模式下，自己的模型设为不可见
            if (isSelf) {
                m.visible = false;
            }

            scene.add(m);
            return m;
        }

        // ===================== Input =====================
        const key = {};
        window.addEventListener("keydown", e => {
            key[e.key.toLowerCase()] = true;
            if (e.key === ' ') e.preventDefault();
        });
        window.addEventListener("keyup", e => key[e.key.toLowerCase()] = false);

        const SPEED = 2;
        setInterval(() => {
            if (!selfId) return;

            let moveX = 0, moveY = 0, moveZ = 0;

            // 根据视角方向计算移动向量
            const forward = new THREE.Vector3(
                Math.sin(yaw),
                0,
                Math.cos(yaw)
            );
            const right = new THREE.Vector3(
                Math.cos(yaw),
                0,
                -Math.sin(yaw)
            );

            // W/S - 前后移动（基于视角方向）
            if (key.w) {
                moveX += forward.x * SPEED;
                moveZ += forward.z * SPEED;
            }
            if (key.s) {
                moveX -= forward.x * SPEED;
                moveZ -= forward.z * SPEED;
            }

            // A/D - 左右平移（基于视角方向）
            if (key.a) {
                moveX -= right.x * SPEED;
                moveZ -= right.z * SPEED;
            }
            if (key.d) {
                moveX += right.x * SPEED;
                moveZ += right.z * SPEED;
            }

            // Space/Shift - 上下移动
            if (key[" "]) moveY += SPEED;
            if (key.shift) moveY -= SPEED;

            // 发送移动指令到服务器
            lastSeq++;
            sendInner(
                T_Input,
                {
                    dirX: Math.round(moveX),
                    dirY: Math.round(moveY),
                    dirZ: Math.round(moveZ),
                    seq: lastSeq,
                    clientTime: Date.now()
                },
                Cmd.PROTO_CMD_CS_REQ_MAP3D_INPUT
            );
        }, 80);

        // ===================== Render Loop =====================
        // 移除子弹清理逻辑，保留所有历史轨迹

        function animate() {
            requestAnimationFrame(animate);

            const self = players.get(selfId);
            if (self) {
                // 第一人称：相机位置在玩家头部
                camera.position.set(
                    self.position.x,
                    self.position.y + EYE_HEIGHT,
                    self.position.z
                );

                // 根据 yaw 和 pitch 设置相机朝向
                camera.rotation.order = 'YXZ';
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            }

            renderer.render(scene, camera);
        }
        animate();

        log("✓ 3D 场景已初始化（第一人称模式）");
        log("请依次点击: 连接 → 登录 → 进入3D地图");
    </script>

</body>

</html>
