            return { group, mesh: pBody, label, prevPos: new THREE.Vector3(), targetPos: new THREE.Vector3(), updateTime: performance.now() };
        }

        function makeLabel(text) {
            const c = document.createElement("canvas"); c.width = 256; c.height = 64;
            const g = c.getContext("2d");
            g.fillStyle = "rgba(0,0,0,0.5)"; g.fillRect(0, 0, 256, 64);
            g.font = "bold 28px sans-serif"; g.fillStyle = "#ffcc44";
            g.textAlign = "center"; g.textBaseline = "middle";
            g.fillText(text, 128, 32);
            const tex = new THREE.CanvasTexture(c);
            const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
            sp.scale.set(2, 0.5, 1); return sp;
        }

        function createBulletMesh() {
            const g = new THREE.SphereGeometry(0.18, 8, 8);
            const m = new THREE.MeshBasicMaterial({ color: 0xffee44, transparent: true });
            const mesh = new THREE.Mesh(g, m);
            const trail = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xffaa33, transparent: true, opacity: 0.7 }));
            scene.add(mesh); scene.add(trail);
            return { mesh, trail, points: [] };
        }
        function handleBullet(b) {
            let bl = bullets.get(b.bulletId);
            if (!bl) { bl = createBulletMesh(); bullets.set(b.bulletId, bl); }
            const pos = new THREE.Vector3(b.x, b.y, b.z);
            bl.mesh.position.copy(pos);
            bl.points.push(pos.clone());
            if (bl.points.length > 20) bl.points.shift();
            bl.trail.geometry.setFromPoints(bl.points);
            bl.born = performance.now();
        }
        function cleanupBullet(id) {
            const bl = bullets.get(id); if (!bl) return;
            scene.remove(bl.mesh); scene.remove(bl.trail);
            bl.mesh.geometry.dispose(); bl.trail.geometry.dispose();
            bullets.delete(id);
        }

        function createHitEffect(x, y, z) {
            const grp = new THREE.Group();
            for (let i = 0; i < 10; i++) {
                const p = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), new THREE.MeshBasicMaterial({ color: 0xff6633, transparent: true }));
                p.position.set(x, y, z);
                const v = new THREE.Vector3((Math.random() - 0.5), Math.random(), (Math.random() - 0.5)).multiplyScalar(6);
                p.userData.v = v; grp.add(p);
            }
            const ring = new THREE.Mesh(new THREE.RingGeometry(0.3, 0.8, 16), new THREE.MeshBasicMaterial({ color: 0xff3333, side: THREE.DoubleSide, transparent: true }));
            ring.position.set(x, y, z); ring.userData.life = 1; grp.add(ring);
            scene.add(grp);
            const start = performance.now();
            (function anim() {
                const t = (performance.now() - start) / 1000;
                if (t > 0.6) {
                    scene.remove(grp);
                    grp.children.forEach(p => { p.geometry.dispose(); p.material.dispose(); });
                    return;
                }
                grp.children.forEach(p => {
                    if (p.userData.v) {
                        p.position.addScaledVector(p.userData.v, 0.016);
                        p.userData.v.y -= 9.8 * 0.016; p.material.opacity = 1 - t / 0.6;
                    }
                    if (p.userData.life) { p.scale.setScalar(1 + t * 3); p.material.opacity = 1 - t / 0.6; }
                });
                requestAnimationFrame(anim);
            })();
        }

        const dmgNums = [];
        function showDamageNumber(x, y, z, dmg) {
            const c = document.createElement("canvas"); c.width = 128; c.height = 64;
            const g = c.getContext("2d");
            g.font = "bold 48px sans-serif"; g.fillStyle = "#ff4444";
            g.textAlign = "center"; g.fillText("-" + dmg, 64, 48);
            const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthTest: false }));
            sp.position.set(x, y, z); sp.scale.set(1.5, 0.75, 1);
            sp.userData.life = 1; sp.userData.vy = 2;
            scene.add(sp); dmgNums.push(sp);
        }

        let yaw = 0, pitch = 0;
        const EYE_HEIGHT = 2.0;
        const PLAYER_RADIUS = 0.6;
        const blocker = document.getElementById("blocker");
        function enterGame() {
            if (isTouch) {
                blocker.classList.add("hidden");
                hintEl.classList.add("hide");
                lastTouchTime = Date.now();
            } else {
                renderer.domElement.requestPointerLock();
            }
        }
        blocker.addEventListener("click", enterGame);
        blocker.addEventListener("touchstart", e => { e.preventDefault(); enterGame(); }, { passive: false });
        document.addEventListener("pointerlockchange", () => {
            if (isTouch) return;
            if (document.pointerLockElement === renderer.domElement) {
                blocker.classList.add("hidden");
                hintEl.classList.add("hide");
            } else {
                // 聊天打开期间释放鼠标锁属正常, 不弹"点击进入"遮罩
                if (!chatOpen && ws && ws.readyState === 1) blocker.classList.remove("hidden");
                hintEl.classList.remove("hide");
            }
        });
        document.addEventListener("mousemove", e => {
            if (document.pointerLockElement !== renderer.domElement) return;
            const sens = 0.0022;
            yaw -= e.movementX * sens;
            pitch -= e.movementY * sens;
            pitch = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, pitch));
        });

        const localPos = new THREE.Vector3();
        const serverPos = new THREE.Vector3();
        const velY = { v: 0 };
        let onGround = true;
        const GRAVITY = 28;
        const JUMP_SPEED = 10;
        const MOVE_SPEED = 7;
        const INPUT_SEND_SPEED = 2;
        const key = {};
        addEventListener("keydown", e => {
            // 在任意输入框(聊天/控制台)内打字时不触发游戏按键
            if (e.target && e.target.tagName === "INPUT") return;
            key[e.key.toLowerCase()] = true;
            if (e.code === "Space") { e.preventDefault(); tryJump(); }
            // T 键 打开/关闭聊天 (触屏无鼠标锁定, 直接点输入框即可)
            if ((e.key === "t" || e.key === "T") && !e.repeat && !isTouch) {
                e.preventDefault();
                if (chatOpen) closeChat(); else openChat();
            }
        });
        addEventListener("keyup", e => {
            if (e.target && e.target.tagName === "INPUT") return;
            key[e.key.toLowerCase()] = false;
        });

        function tryJump() { if (onGround) { velY.v = JUMP_SPEED; onGround = false; } }

        /* ------- 触屏: 左摇杆 / 右拖拽瞄准 / 开火·跳跃·下蹲 ------- */
        if (isTouch) {
            document.addEventListener("touchstart", e => {
                lastTouchTime = Date.now();
                if (!blocker.classList.contains("hidden")) return;
                for (const t of e.changedTouches) {
                    if (inUi(t.target)) continue;
                    if (joyTouchId === null && t.clientX < innerWidth * 0.5) {
                        joyTouchId = t.identifier;
                        joyOrigin.x = t.clientX; joyOrigin.y = t.clientY;
                        joyBaseEl.style.left = t.clientX + "px";
                        joyBaseEl.style.top = t.clientY + "px";
                        joyBaseEl.classList.add("on");
                        stick.x = 0; stick.y = 0;
                        e.preventDefault();
                    } else if (lookTouchId === null && t.clientX >= innerWidth * 0.5) {
                        lookTouchId = t.identifier;
                        lookLast = { x: t.clientX, y: t.clientY };
                        e.preventDefault();
                    }
                }
            }, { passive: false });

            document.addEventListener("touchmove", e => {
                let handled = false;
                for (const t of e.changedTouches) {
                    if (t.identifier === joyTouchId) {
                        const dx = t.clientX - joyOrigin.x, dy = t.clientY - joyOrigin.y;
                        const R = 56, d = Math.hypot(dx, dy);
                        const k = Math.min(1, d / R), ang = Math.atan2(dy, dx);
                        const ox = Math.cos(ang) * Math.min(d, R);
                        const oy = Math.sin(ang) * Math.min(d, R);
                        joyKnobEl.style.transform = "translate(calc(-50% + " + ox + "px), calc(-50% + " + oy + "px))";
                        stick.x = Math.cos(ang) * k;
                        stick.y = Math.sin(ang) * k;
                        handled = true;
                    } else if (t.identifier === lookTouchId) {
                        const dx = t.clientX - lookLast.x, dy = t.clientY - lookLast.y;
                        yaw -= dx * LOOK_TOUCH_SENS;
                        pitch -= dy * LOOK_TOUCH_SENS;
                        pitch = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, pitch));
                        lookLast = { x: t.clientX, y: t.clientY };
                        handled = true;
                    }
                }
                if (handled) e.preventDefault();
            }, { passive: false });

            const endTouch = e => {
                for (const t of e.changedTouches) {
                    if (t.identifier === joyTouchId) {
                        joyTouchId = null; stick.x = 0; stick.y = 0;
                        joyBaseEl.classList.remove("on");
                    }
                    if (t.identifier === lookTouchId) lookTouchId = null;
                }
            };
            document.addEventListener("touchend", endTouch);
            document.addEventListener("touchcancel", endTouch);

            btnFireEl.addEventListener("touchstart", e => { e.preventDefault(); e.stopPropagation(); firing = true; shoot(); }, { passive: false });
            btnFireEl.addEventListener("touchend", e => { e.preventDefault(); e.stopPropagation(); firing = false; }, { passive: false });
            btnFireEl.addEventListener("touchcancel", () => { firing = false; });

            btnJumpEl.addEventListener("touchstart", e => { e.preventDefault(); e.stopPropagation(); tryJump(); }, { passive: false });

            btnCrouchEl.addEventListener("touchstart", e => {
                e.preventDefault(); e.stopPropagation();
                crouch.on = !crouch.on;
                btnCrouchEl.classList.toggle("active", crouch.on);
            }, { passive: false });
        }

        // AABB 碰撞解析（最小穿透轴）：每次把重叠按 X/Z 中穿透较浅的一轴完全移出，
        // 保证人物绝不进入墙体/建筑，也不会从墙角滑穿到墙外；贴墙时可平滑滑动。
        function collide(pos) {
            for (const o of obstacles) {
                const dx = pos.x - o.mesh.position.x, dy = pos.y - o.mesh.position.y, dz = pos.z - o.mesh.position.z;
                const hx = o.half.x + PLAYER_RADIUS, hy = o.half.y + 10, hz = o.half.z + PLAYER_RADIUS;
                if (Math.abs(dx) < hx && Math.abs(dy) < hy && Math.abs(dz) < hz) {
                    const px = hx - Math.abs(dx), pz = hz - Math.abs(dz);
                    if (px < pz) pos.x += dx > 0 ? px : -px;
                    else pos.z += dz > 0 ? pz : -pz;
                }
            }
        }

        function computeMove(_f, _r) {
            let mx = 0, mz = 0;
            if (key.w) { mx += _f.x; mz += _f.z; }
            if (key.s) { mx -= _f.x; mz -= _f.z; }
            if (key.a) { mx -= _r.x; mz -= _r.z; }
            if (key.d) { mx += _r.x; mz += _r.z; }
            mx += stick.x * _r.x + stick.y * _f.x;
            mz += stick.x * _r.z + stick.y * _f.z;
            const len = Math.hypot(mx, mz);
            let dx = 0, dz = 0, mag = 0;
            if (len > 0) { dx = mx / len; dz = mz / len; mag = Math.min(len, 1); }
            return { dx, dz, mag };
        }

        setInterval(() => {
            if (!selfId) return;
            const f = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
            const r = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
            const mv = computeMove(f, r);
            let my = 0;
            if (!onGround && velY.v > 0) my = INPUT_SEND_SPEED;
            else if (key.shift || crouch.on) my = -INPUT_SEND_SPEED;

            // —— 本地预测方向探测 ——
            // 权威碰撞(防穿墙)在服务器执行, 客户端用服务器下发的同一份盒数据做本地预测。
            // 从本机当前位置向 X / Z 各轴独立做小步探测, 被 collide 推回 = 该轴有墙 → 该轴方向置零,
            // 只把可通行方向发给服务器, 使本机预测与服务器权威位置在贴墙时保持一致(漂移最小)。
            const PROBE = 1.0; // ≥ 服务器单帧最大位移，确保服务器不会冲过探测范围
            let dirX = mv.dx * mv.mag;
            let dirZ = mv.dz * mv.mag;

            // X 轴探测：朝该方向走 PROBE，被推回说明有墙
            if (Math.abs(dirX) > 0.001) {
                const px = new THREE.Vector3(localPos.x + Math.sign(dirX) * PROBE, localPos.y, localPos.z);
                const beforeX = px.x;
                collide(px);
                if (Math.abs(px.x - beforeX) > 0.001) dirX = 0;
            }
            // Z 轴探测
            if (Math.abs(dirZ) > 0.001) {
                const pz = new THREE.Vector3(localPos.x, localPos.y, localPos.z + Math.sign(dirZ) * PROBE);
                const beforeZ = pz.z;
                collide(pz);
                if (Math.abs(pz.z - beforeZ) > 0.001) dirZ = 0;
            }

            const sendX = Math.round(dirX * INPUT_SEND_SPEED);
            const sendZ = Math.round(dirZ * INPUT_SEND_SPEED);

            lastSeq++;
            sendInner(T_Input, { dirX: sendX, dirY: Math.round(my), dirZ: sendZ, seq: lastSeq, clientTime: Date.now() }, Cmd.PROTO_CMD_CS_REQ_MAP3D_INPUT);
        }, 80);

        let lastShootTime = 0;
        const SHOOT_COOLDOWN = 140;

        function shoot() {
            if (!selfId) return;
            const now = Date.now();
            if (now - lastShootTime < SHOOT_COOLDOWN) return;
            lastShootTime = now;
            viewModel.position.z = 0.06;
            flashTime = 0.05;
            flash.material.opacity = 1;
            flash.scale.setScalar(1 + Math.random() * 0.6);

            // 准星后坐力反馈
            crosshairEl.classList.remove("kick");
            void crosshairEl.offsetWidth;
            crosshairEl.classList.add("kick");

            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            const dirXn = Math.round(dir.x * 10000);
            const dirYn = Math.round(dir.y * 10000);
            const dirZn = Math.round(dir.z * 10000);

            sendInner(T_Shoot, {
                shooterId: selfId,
                dirX: dirXn, dirY: dirYn, dirZ: dirZn,
                shootDist: SHOOT_DIST, clientTime: Date.now()
            }, Cmd.PROTO_CMD_CS_REQ_MAP3D_SHOOT);

            const ray = new THREE.Raycaster();
            ray.setFromCamera(new THREE.Vector2(0, 0), camera);
            const hit = ray.intersectObjects(obstacleMeshes, false);
            const muzzlePos = muzzle.getWorldPosition(new THREE.Vector3());
            if (hit.length) {
                createTracer(muzzlePos, hit[0].point);
                createWallImpact(hit[0].point.x, hit[0].point.y, hit[0].point.z);
            } else {
                const end = dir.clone().multiplyScalar(120).add(camera.getWorldPosition(new THREE.Vector3()));
                createTracer(muzzlePos, end);
            }
        }

        function createTracer(a, b) {
            const g = new THREE.BufferGeometry().setFromPoints([a, b]);
            const l = new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xffee66, transparent: true, opacity: 0.8 }));
            scene.add(l);
            let t = 0;
            (function f() { t += 0.05; l.material.opacity = 0.8 - t; if (t > 0.8) { scene.remove(l); g.dispose(); l.material.dispose(); return; } requestAnimationFrame(f); })();
        }

        // 子弹打在墙上的火花/碎屑
        function createWallImpact(x, y, z) {
            const grp = new THREE.Group();
            for (let i = 0; i < 7; i++) {
                const p = new THREE.Mesh(new THREE.SphereGeometry(0.06, 5, 5),
                    new THREE.MeshBasicMaterial({ color: 0xcfd8e4, transparent: true }));
                p.position.set(x, y, z);
                const v = new THREE.Vector3((Math.random() - 0.5), Math.random() * 0.7, (Math.random() - 0.5)).multiplyScalar(3.2);
                p.userData.v = v; grp.add(p);
            }
            scene.add(grp);
            const start = performance.now();
            (function anim() {
                const t = (performance.now() - start) / 1000;
                if (t > 0.4) {
                    scene.remove(grp);
                    grp.children.forEach(p => { p.geometry.dispose(); p.material.dispose(); });
                    return;
                }
                grp.children.forEach(p => {
                    p.position.addScaledVector(p.userData.v, 0.016);
                    p.userData.v.y -= 4 * 0.016;
                    p.material.opacity = 1 - t / 0.4;
                });
                requestAnimationFrame(anim);
            })();
        }

        renderer.domElement.addEventListener("mousedown", e => {
            if (isTouch && Date.now() - lastTouchTime < 700) return;
            if (document.pointerLockElement === renderer.domElement) shoot();
        });

        function updateHpUI() {
            const pct = Math.max(0, myHp / myMaxHp);
            document.getElementById("hpfill").style.width = (pct * 100) + "%";
            document.getElementById("hptext").textContent = `HP ${myHp} / ${myMaxHp}`;
        }
        function flashDamage() {
            const f = document.getElementById("dmgflash");
            f.style.transition = "none"; f.style.opacity = "0.8";
            requestAnimationFrame(() => { f.style.transition = "opacity .5s"; f.style.opacity = "0"; });
        }
        updateHpUI();

        const cpSelfIdEl = document.getElementById("cpSelfId");
        const cpSelfLocalEl = document.getElementById("cpSelfLocal");
        const cpSelfSvrEl = document.getElementById("cpSelfServer");
        const cpOthersEl = document.getElementById("cpOthers");

        function fmt(v) { return v.toFixed(2).padStart(8, " "); }

        let cpAccum = 0;
        function updateCoordPanel(dt) {
            cpAccum += dt;
            if (cpAccum < 0.1) return;
            cpAccum = 0;

            // 漂移采样: |本机预测 - 服务器权威|
            if (selfId) {
                lastDrift = Math.hypot(localPos.x - serverPos.x, localPos.y - serverPos.y, localPos.z - serverPos.z);
                driftGood = lastDrift < 3;
                driftBuf.push(lastDrift);
                if (driftBuf.length > 40) driftBuf.shift();
            }
            drawDrift();

            cpSelfIdEl.innerHTML = `<span class="lbl">我的ID:　</span> ${selfId ?? "--"}`;
            cpSelfLocalEl.innerHTML = `<span class="lbl">本机(预测):</span> X${fmt(localPos.x)} Y${fmt(localPos.y)} Z${fmt(localPos.z)}`;
            cpSelfSvrEl.innerHTML = `<span class="lbl">服务器:　</span> X${fmt(serverPos.x)} Y${fmt(serverPos.y)} Z${fmt(serverPos.z)}`;
            let html = "", count = 0;
            players.forEach((p, id) => {
                if (id === selfId) return;
                count++;
                const t = p.targetPos;
                html += `<div class="cp-other"><span class="id">[${id}]</span> X${fmt(t.x)} Y${fmt(t.y)} Z${fmt(t.z)}</div>`;
            });
            cpOthersEl.innerHTML = count ? html : `<div class="cp-empty">暂无其他玩家</div>`;
            toggleOthersEl.textContent = `其他玩家 (${count}) ${othersOpen ? "▴" : "▾"}`;
        }

        const clock = new THREE.Clock();
        const _f = new THREE.Vector3();
        const _r = new THREE.Vector3();
        const _dir = new THREE.Vector3();
        const _occ = new THREE.Vector3();
        const occlusionRay = new THREE.Raycaster();

        /* ------- 小地图：建筑布局 + 玩家位置 ------- */
        const minimapEl = document.getElementById("minimap");
        const mmCtx = minimapEl.getContext("2d");
        const MM = minimapEl.width, MM_HALF = MM / 2;
        const MAP_EXTENT = 60;                 // 地图半宽
        const MM_SCALE = MM_HALF / MAP_EXTENT;
        function drawMinimap() {
            mmCtx.clearRect(0, 0, MM, MM);
            // 墙体
            mmCtx.fillStyle = "rgba(120,150,190,.6)";
            for (const o of obstacles) {
                const px = MM_HALF + (o.mesh.position.x - o.half.x) * MM_SCALE;
                const py = MM_HALF + (o.mesh.position.z - o.half.z) * MM_SCALE;
                mmCtx.fillRect(px, py, o.half.x * 2 * MM_SCALE, o.half.z * 2 * MM_SCALE);
            }
            // 本机（绿色 + 朝向）
            if (selfId) {
                const sx = MM_HALF + localPos.x * MM_SCALE;
                const sz = MM_HALF + localPos.z * MM_SCALE;
                mmCtx.fillStyle = "#6fe9b0";
                mmCtx.beginPath(); mmCtx.arc(sx, sz, 4, 0, Math.PI * 2); mmCtx.fill();
                mmCtx.strokeStyle = "#6fe9b0"; mmCtx.lineWidth = 2;
                mmCtx.beginPath(); mmCtx.moveTo(sx, sz);
                mmCtx.lineTo(sx + Math.sin(yaw) * 11, sz + Math.cos(yaw) * 11); mmCtx.stroke();
            }
            // 其他玩家（蓝色）
            players.forEach((p, id) => {
                if (id === selfId) return;
                const px = MM_HALF + p.targetPos.x * MM_SCALE;
                const pz = MM_HALF + p.targetPos.z * MM_SCALE;
                mmCtx.fillStyle = "#3d9bff";
                mmCtx.beginPath(); mmCtx.arc(px, pz, 3.5, 0, Math.PI * 2); mmCtx.fill();
            });
            // 边界
            mmCtx.strokeStyle = "rgba(111,233,176,.4)";
            mmCtx.lineWidth = 2;
            mmCtx.strokeRect(MM_HALF - MAP_EXTENT * MM_SCALE, MM_HALF - MAP_EXTENT * MM_SCALE,
                MAP_EXTENT * 2 * MM_SCALE, MAP_EXTENT * 2 * MM_SCALE);
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);

            if (selfId) {
                _f.set(Math.sin(yaw), 0, Math.cos(yaw));
                _r.set(Math.cos(yaw), 0, -Math.sin(yaw));
                const mv = computeMove(_f, _r);
                const s = mv.mag * MOVE_SPEED * dt;

                // 移动 + 最小穿透碰撞解析：贴墙滑动、不可穿墙
                localPos.x += mv.dx * s;
                localPos.z += mv.dz * s;
                collide(localPos);

                // 重力
                velY.v -= GRAVITY * dt;
                localPos.y += velY.v * dt;
                if (localPos.y <= GROUND_Y) {
                    localPos.y = GROUND_Y;
                    velY.v = 0;
                    onGround = true;
                }

                // 服务器权威校正：限制单次幅度 + 碰撞感知，避免被拉进墙体/建筑
                const corr = err => Math.max(-2, Math.min(2, err)) * Math.min(1, dt * 4);
                localPos.x += corr(serverPos.x - localPos.x);
                localPos.z += corr(serverPos.z - localPos.z);
                collide(localPos);

                camera.position.set(localPos.x, localPos.y + EYE_HEIGHT, localPos.z);
                camera.rotation.order = "YXZ";
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            }

            viewModel.position.z += (0 - viewModel.position.z) * Math.min(1, dt * 12);
            if (flashTime > 0) { flashTime -= dt; if (flashTime <= 0) { flash.material.opacity = 0; } }
            if (firing && selfId && Date.now() - lastShootTime >= SHOOT_COOLDOWN) shoot();

            players.forEach((p, id) => {
                if (id === selfId) return;
                _dir.subVectors(p.targetPos, p.group.position);
                p.group.position.lerp(p.targetPos, dt * 12);
                collide(p.group.position); // 补间逼近过程中同样做碰撞钳制，杜绝敌人穿墙闪现
                if (_dir.lengthSq() > 0.001) {
                    _dir.y = 0;
                    _dir.normalize();
                    const targetRot = Math.atan2(_dir.x, _dir.z);
                    let rotDiff = targetRot - p.group.rotation.y;
                    while (rotDiff > Math.PI) rotDiff -= Math.PI * 2;
                    while (rotDiff < -Math.PI) rotDiff += Math.PI * 2;
                    p.group.rotation.y += rotDiff * dt * 10;
                }
                // 墙体遮挡：视线被建筑挡住时隐藏敌人，防止“隔墙透视”
                _occ.subVectors(p.group.position, camera.position);
                _occ.y += 1.8;
                const occDist = _occ.length();
                if (occDist > 0.5) {
                    _occ.normalize();
                    occlusionRay.set(camera.position, _occ);
                    occlusionRay.far = occDist - 0.2;
                    const wallHits = occlusionRay.intersectObjects(obstacleMeshes, false);
                    p.group.visible = wallHits.length === 0;
                }
            });

            const now = performance.now();
            bullets.forEach((bl, id) => {
                if (now - bl.born > 2000) {
                    bl.mesh.material.opacity = Math.max(0, 1 - (now - bl.born - 2000) / 500);
                    if (now - bl.born > 2500) cleanupBullet(id);
                }
            });

            for (let i = dmgNums.length - 1; i >= 0; i--) {
                const s = dmgNums[i];
                s.userData.life -= dt;
                s.position.y += s.userData.vy * dt;
                s.userData.vy -= 2 * dt;
                s.material.opacity = Math.max(0, s.userData.life);
                if (s.userData.life <= 0) { scene.remove(s); dmgNums.splice(i, 1); }
            }

            updateCoordPanel(dt);
            drawMinimap();
            renderer.render(scene, camera);
        }
        animate();

        function fitScreen() {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        }
        addEventListener("resize", fitScreen);
        if (window.visualViewport) window.visualViewport.addEventListener("resize", fitScreen);

        log("✓ AVANT FPS 已初始化 (地面 Y=" + GROUND_Y + ")");
    </script>
</body>

</html>
