<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <title>AVANT — MAPSVR·3D 服务器权威客户端</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           AVANT MAPSVR·3D — 服务器权威客户端 (重新设计)
           主题: 玻璃座舱 (Glass Cockpit) + 全屏世界
           语义色: 薄荷绿=已连接/本机/权威 · 钢蓝=标签 · 琥珀=漂移告警
                   红=伤害/错误 · 蓝=其他玩家
           ============================================================ */
        :root {
            --ink: #070a12;
            --panel: rgba(9, 14, 26, .86);
            --panel-solid: #0d1424;
            --signal: #6fe9b0;
            --steel: #8fa6c8;
            --ember: #ff5d5d;
            --amber: #ffc857;
            --ally: #3d9bff;
            --line: rgba(143, 166, 200, .16);
            --line-strong: rgba(143, 166, 200, .32);
            --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            --sans: 'Inter', system-ui, -apple-system, 'Microsoft YaHei', sans-serif;
            --disp: 'Chakra Petch', 'Inter', system-ui, sans-serif;
            --ease: cubic-bezier(.22, .61, .36, 1);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: var(--ink);
            color: #dce7ff;
            font-family: var(--sans);
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        :focus-visible {
            outline: 2px solid var(--signal);
            outline-offset: 2px;
        }

        /* ---------- 顶部遥测条 (玻璃座舱读数条) ---------- */
        #telem {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 42px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            background: linear-gradient(180deg, rgba(6, 9, 16, .94), rgba(6, 9, 16, .72));
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(8px);
            z-index: 90;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: .06em;
        }

        .wordmark {
            font-family: var(--disp);
            font-weight: 700;
            letter-spacing: .32em;
            font-size: 15px;
            color: #eaf2ff;
            white-space: nowrap;
        }

        .wordmark-sub {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: .24em;
            color: var(--signal);
            margin-left: 12px;
            white-space: nowrap;
        }

        .telem-seg {
            display: flex;
            align-items: baseline;
            gap: 7px;
            padding: 0 14px;
            height: 22px;
            border-left: 1px solid var(--line);
            white-space: nowrap;
        }

        .tlbl {
            color: var(--steel);
            font-size: 9px;
            letter-spacing: .2em;
            text-transform: uppercase;
        }

        .dot {
            align-self: center;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #3a4659;
            box-shadow: 0 0 0 3px rgba(58, 70, 89, .18);
            transition: background .2s, box-shadow .2s;
        }

        .dot.online {
            background: var(--signal);
            box-shadow: 0 0 0 3px rgba(111, 233, 176, .18), 0 0 10px rgba(111, 233, 176, .5);
        }

        .dot.connecting {
            background: var(--amber);
            box-shadow: 0 0 0 3px rgba(255, 200, 87, .18);
        }

        .dot.error {
            background: var(--ember);
            box-shadow: 0 0 0 3px rgba(255, 93, 93, .18);
        }

        .console-tab {
            margin-left: auto;
            pointer-events: auto;
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 6px;
            color: var(--steel);
            font: 600 10px var(--disp);
            letter-spacing: .14em;
            padding: 6px 12px;
            cursor: pointer;
            transition: color .15s, border-color .15s, background .15s;
        }

        .console-tab:hover {
            color: var(--signal);
            border-color: var(--signal);
            background: rgba(111, 233, 176, .06);
        }

        /* ---------- 左侧连接控制台 (可折叠滑出) ---------- */
        #console {
            position: fixed;
            left: 0;
            top: 42px;
            bottom: 0;
            width: 298px;
            padding: 14px;
            background: var(--panel);
            border-right: 1px solid var(--line);
            border-top: 1px solid var(--line);
            backdrop-filter: blur(12px);
            z-index: 80;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transform: translateX(0);
            transition: transform .28s var(--ease);
        }

        #console.collapsed {
            transform: translateX(-105%);
        }

        .field span {
            display: block;
            font: 600 9px var(--disp);
            letter-spacing: .18em;
            color: var(--steel);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .field-row {
            display: flex;
            gap: 8px;
        }

        .field-row .field {
            flex: 1;
        }

        input {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #0a0f1c;
            color: #e8f0ff;
            font: 500 13px/1 var(--mono);
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }

        input:focus-visible {
            border-color: var(--signal);
            box-shadow: 0 0 0 3px rgba(111, 233, 176, .14);
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            cursor: pointer;
            padding: 9px 0;
            border-radius: 6px;
            border: 1px solid var(--line-strong);
            background: transparent;
            color: #dce7ff;
            font: 600 12px var(--disp);
            letter-spacing: .14em;
            transition: color .15s, border-color .15s, background .15s, transform .1s;
        }

        .btn:hover {
            color: var(--signal);
            border-color: var(--signal);
            background: rgba(111, 233, 176, .06);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-enter {
            background: linear-gradient(180deg, #0f3d2a, #0a2a1d);
            border-color: rgba(111, 233, 176, .5);
            color: var(--signal);
        }

        .btn-enter:hover {
            background: linear-gradient(180deg, #145036, #0e3425);
            border-color: var(--signal);
        }

        .btn-alt {
            border-color: var(--line);
            color: var(--steel);
        }

        .btn-alt:hover {
            color: var(--amber);
            border-color: var(--amber);
            background: rgba(255, 200, 87, .05);
        }

        #log {
            flex: 1;
            min-height: 0;
            margin: 0;
            overflow: auto;
            padding: 9px;
            background: #05070e;
            border: 1px solid var(--line);
            border-radius: 6px;
            font: 400 11px/1.6 var(--mono);
            color: #9fb6d8;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* ---------- HUD 图层 ---------- */
        #hud {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
        }

        /* 准星 */
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 93, 93, .9);
        }

        #crosshair::before {
            left: 50%;
            top: 0;
            width: 1.5px;
            height: 100%;
            transform: translateX(-50%);
        }

        #crosshair::after {
            top: 50%;
            left: 0;
            height: 1.5px;
            width: 100%;
            transform: translateY(-50%);
        }

        #crosshair .dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2.5px;
            height: 2.5px;
            border-radius: 50%;
            background: #ff5d5d;
            transform: translate(-50%, -50%);
        }

        @keyframes recoil {
            0% {
                transform: translate(-50%, -50%) scale(1.9);
                opacity: .35;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        #crosshair.kick {
            animation: recoil .14s ease;
        }

        /* 击杀播报 */
        #killfeed {
            position: fixed;
            top: 56px;
            right: 14px;
            width: 290px;
            text-align: right;
            font-family: var(--mono);
            font-size: 11px;
        }

        #killfeed div {
            background: rgba(5, 8, 14, .66);
            border: 1px solid var(--line);
            border-left: 2px solid var(--ember);
            padding: 6px 10px;
            margin-bottom: 5px;
            border-radius: 6px;
            animation: kfIn .25s var(--ease), kfOut .6s ease 3.4s forwards;
        }

        @keyframes kfIn {
            from {
                opacity: 0;
                transform: translateX(10px);
            }
        }

        @keyframes kfOut {
            to {
                opacity: 0;
            }
        }

        /* K/D/在线 统计仪表 */
        #stats {
            position: fixed;
            bottom: 16px;
            right: 16px;
            display: flex;
            gap: 18px;
            padding: 11px 16px;
            background: rgba(7, 10, 18, .6);
            border: 1px solid var(--line);
            border-radius: 9px;
            text-align: center;
        }

        .stat .tlbl {
            display: block;
            font-size: 8px;
            margin-bottom: 4px;
        }

        #stats b {
            display: block;
            font: 700 15px var(--mono);
            color: #eaf2ff;
        }

        /* ---------- 底部 · 生命条 ---------- */
        #hpwrap {
            position: fixed;
            left: 16px;
            bottom: 16px;
            width: 250px;
        }

        #hpbar {
            height: 12px;
            background: rgba(0, 0, 0, .45);
            border: 1px solid var(--line);
            border-radius: 6px;
            overflow: hidden;
        }

        #hpfill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #e63946, #ff8a5b);
            transition: width .2s var(--ease);
        }

        #hptext {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .08em;
            color: var(--steel);
            margin-top: 5px;
        }

        /* ---------- 签名元素: SERVER AUTHORITY 漂移仪表 ----------
           左侧工具 · 实时绘制「本机预测 vs 服务器权威」位置偏差 */
        #authority {
            position: fixed;
            left: 16px;
            bottom: 58px;
            width: 250px;
            padding: 12px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
            font-family: var(--mono);
            z-index: 55;
        }

        #authority::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10px;
            right: 10px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--signal), transparent);
            opacity: .55;
        }

        .instrument-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 9px;
        }

        .instrument-title {
            font-family: var(--disp);
            font-weight: 600;
            font-size: 10px;
            letter-spacing: .26em;
            color: var(--signal);
        }

        .instrument-tag {
            font-size: 9px;
            letter-spacing: .14em;
            color: var(--steel);
        }

        #driftCanvas {
            width: 100%;
            height: 40px;
            display: block;
            margin-bottom: 9px;
        }

        .ro {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 10px;
            color: #c6d6f0;
            margin: 3px 0;
            gap: 8px;
            min-width: 0;
        }

        .ro .lbl {
            color: var(--steel);
            font-size: 9px;
            letter-spacing: .1em;
            flex-shrink: 0;
        }

        .val {
            font-size: 10px;
            color: #dce7ff;
            white-space: pre;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .val.good {
            color: var(--signal);
        }

        .val.warn {
            color: var(--amber);
        }

        .drift-row .lbl {
            font-family: var(--disp);
            font-weight: 600;
            letter-spacing: .22em;
            font-size: 9px;
        }

        .drift-row .val {
            font-size: 15px;
            font-weight: 700;
        }

        .drift-row .unit {
            color: var(--steel);
            font-size: 9px;
            margin-left: 2px;
        }

        .cp-other {
            font-size: 10px;
            color: #b9cdf0;
            line-height: 1.7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cp-other .id {
            color: var(--amber);
        }

        .cp-empty {
            color: #51627d;
            font-style: italic;
            font-size: 10px;
        }

        .instrument-toggle {
            pointer-events: auto;
            margin-top: 9px;
            width: 100%;
            padding: 6px 8px;
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 5px;
            color: var(--steel);
            font: 600 10px var(--disp);
            letter-spacing: .14em;
            cursor: pointer;
            transition: color .15s, border-color .15s, background .15s;
        }

        .instrument-toggle:hover {
            color: var(--signal);
            border-color: var(--signal);
            background: rgba(111, 233, 176, .06);
        }

        #othersWrap {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height .25s var(--ease), opacity .2s;
        }

        #othersWrap.open {
            max-height: 150px;
            opacity: 1;
            overflow-y: auto;
        }

        /* ---------- 底部中央提示 ---------- */
        #hint {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(7, 10, 18, .66);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 7px 16px;
            font: 500 11px/1 var(--sans);
            letter-spacing: .06em;
            color: var(--steel);
            transition: opacity .4s, transform .4s;
        }

        #hint.hide {
            opacity: 0;
            transform: translate(-50%, 8px);
        }

        /* ---------- 受击泛红 ---------- */
        #dmgflash {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(230, 57, 70, .5));
            opacity: 0;
            z-index: 60;
        }

        .hidden {
            display: none !important;
        }

        /* ---------- 进入遮罩 (点击进入第一人称) ---------- */
        #blocker {
            position: fixed;
            inset: 0;
            background: radial-gradient(120% 120% at 50% 40%, rgba(6, 9, 16, .55), rgba(3, 5, 9, .92));
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #blocker .card {
            text-align: center;
            padding: 46px 62px;
            border: 1px solid var(--line-strong);
            border-radius: 14px;
            background: rgba(9, 14, 26, .72);
            backdrop-filter: blur(14px);
            box-shadow: 0 24px 80px rgba(0, 0, 0, .5);
            animation: cardIn .45s var(--ease);
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: scale(.97) translateY(6px);
            }
        }

        #blocker .wordmark {
            display: block;
            font-size: 30px;
            letter-spacing: .5em;
            text-indent: .5em;
            color: var(--signal);
            margin-bottom: 12px;
        }

        #blocker h1 {
            margin: 0 0 8px;
            font-family: var(--disp);
            font-weight: 600;
            font-size: 20px;
            letter-spacing: .16em;
            color: #eaf2ff;
        }

        #blocker p {
            margin: 4px 0;
            color: var(--steel);
            font-size: 12.5px;
        }

        #blocker .meta {
            margin-top: 16px;
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .08em;
            color: rgba(143, 166, 200, .7);
        }

        #blocker .enter-hint {
            display: inline-block;
            margin-top: 18px;
            font: 700 11px var(--disp);
            letter-spacing: .3em;
            color: var(--signal);
            border: 1px solid rgba(111, 233, 176, .4);
            border-radius: 999px;
            padding: 8px 22px;
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .45;
            }
        }

        /* ---------- 无障碍与响应式 ---------- */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }

        @media (max-width: 760px) {
            #telem {
                padding: 0 6px;
            }

            .telem-seg {
                padding: 0 8px;
            }

            #telem .wordmark-sub,
            #telem .seg-rtt {
                display: none;
            }

            #console {
                width: 100%;
            }

            #authority {
                width: 200px;
            }

            #stats {
                bottom: 12px;
                right: 12px;
                gap: 12px;
                padding: 8px 12px;
            }

            #stats b {
                font-size: 12px;
            }

            #hint {
                font-size: 10px;
                padding: 6px 12px;
            }
        }
    </style>
</head>

<body>

    <!-- 顶部遥测条 -->
    <header id="telem">
        <span class="wordmark">AVANT</span><span class="wordmark-sub">MAPSVR·3D</span>
        <div class="telem-seg">
            <span class="dot offline" id="connDot"></span>
            <span id="connState" style="color:var(--steel)">离线</span>
        </div>
        <div class="telem-seg seg-user"><span class="tlbl">USER</span><span id="telemUser">—</span></div>
        <div class="telem-seg seg-map"><span class="tlbl">MAP</span><span id="telemMap">—</span></div>
        <div class="telem-seg seg-seq"><span class="tlbl">SEQ</span><span id="telemSeq">0</span></div>
        <div class="telem-seg seg-rtt"><span class="tlbl">RTT</span><span id="telemRtt">—</span></div>
        <div class="telem-seg seg-online"><span class="tlbl">在线</span><span id="telemOnline">0</span></div>
        <button id="consoleTab" class="console-tab" aria-expanded="true">控制台 ▸</button>
    </header>

    <!-- 连接控制台 -->
    <aside id="console" aria-label="连接控制台">
        <label class="field"><span>WebSocket 地址</span>
            <input id="wsUrl" value="ws://127.0.0.1:20026" spellcheck="false" autocomplete="off" />
        </label>
        <div class="field-row">
            <label class="field"><span>userId</span><input id="userId" value="1" /></label>
            <label class="field"><span>password</span><input id="password" value="1" type="password" /></label>
        </div>
        <div class="actions">
            <button id="btnConnect" class="btn">连接</button>
            <button id="btnLogin" class="btn">登录</button>
            <button id="btnEnter" class="btn btn-enter">进入3D地图</button>
            <button id="btnCreateUser" class="btn btn-alt">注册账号</button>
        </div>
        <pre id="log">等待连接…</pre>
    </aside>

    <!-- HUD 图层 -->
    <div id="hud">
        <div id="crosshair"><div class="dot"></div></div>

        <!-- 签名仪表: 服务器权威漂移监控 -->
        <div id="authority">
            <div class="instrument-head">
                <span class="instrument-title">SERVER AUTHORITY</span>
                <span class="instrument-tag">漂移监控</span>
            </div>
            <canvas id="driftCanvas" width="440" height="80"></canvas>
            <div class="ro drift-row">
                <span class="lbl">漂移</span>
                <span><span id="driftVal" class="val">—</span><span class="unit">u</span></span>
            </div>
            <div class="ro"><span id="cpSelfLocal">本机(预测): --</span></div>
            <div class="ro"><span id="cpSelfServer">服务器: --</span></div>
            <div class="ro"><span id="cpSelfId">我的ID: --</span></div>
            <button id="toggleOthers" class="instrument-toggle">其他玩家 (0) ▾</button>
            <div id="othersWrap">
                <div id="cpOthers"><div class="cp-empty">暂无其他玩家</div></div>
            </div>
        </div>

        <!-- 生命条 -->
        <div id="hpwrap">
            <div id="hpbar"><div id="hpfill"></div></div>
            <div id="hptext">HP 100 / 100</div>
        </div>

        <!-- 击杀播报 -->
        <div id="killfeed"></div>

        <!-- K/D/在线 统计 -->
        <div id="stats">
            <div class="stat"><span class="tlbl">KILLS</span><b id="kills">0</b></div>
            <div class="stat"><span class="tlbl">DIES</span><b id="deaths">0</b></div>
            <div class="stat"><span class="tlbl">ON-LINE</span><b id="online">0</b></div>
        </div>
    </div>

    <div id="hint">WASD 移动 · 空格 跳跃 · 鼠标 瞄准 · 点击 射击 · ESC 解锁</div>
    <div id="dmgflash"></div>

    <!-- 进入遮罩 -->
    <div id="blocker" class="hidden">
        <div class="card">
            <span class="wordmark">AVANT</span>
            <h1>点击进入第一人称</h1>
            <p>WASD 移动 / 空格 跳跃 / 鼠标 瞄准 / 点击 射击</p>
            <p class="meta">按 ESC 退出鼠标锁定 · 左下角实时监控服务器权威坐标</p>
            <span class="enter-hint">点击 进入 ▶</span>
        </div>
    </div>

    <!-- 依赖 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.5/dist/protobuf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
    <script>
        const protoText = `
syntax="proto3";
package avant;
enum ProtoCmd{
    PROTO_CMD_CS_REQ_EXAMPLE = 0; PROTO_CMD_CS_RES_EXAMPLE = 1;
    PROTO_CMD_TUNNEL_MAIN2WORKER_NEW_CLIENT = 2; PROTO_CMD_TUNNEL_PACKAGE = 3;
    PROTO_CMD_TUNNEL_CLIENT_FORWARD_MESSAGE = 4; PROTO_CMD_TUNNEL_WEBSOCKET_BROADCAST = 5;
    PROTO_CMD_TUNNEL_WORKER2OTHER_EVENT_NEW_CLIENT_CONNECTION = 6; PROTO_CMD_TUNNEL_OTHER2WORKER_TEST = 7;
    PROTO_CMD_LUA_TEST = 8; PROTO_CMD_IPC_STREAM_AUTH_HANDSHAKE = 9;
    PROTO_CMD_TUNNEL_WORKER2OTHER_LUAVM = 10; PROTO_CMD_TUNNEL_OTHERLUAVM2WORKERCONN = 11;
    PROTO_CMD_TUNNEL_WORKER2OTHER_EVENT_CLOSE_CLIENT_CONNECTION = 12; PROTO_CMD_TUNNEL_OTHERLUAVM2WORKER_CLOSE_CLIENT_CONNECTION = 13;
    PROTO_CMD_UDP_SAFESTOP_REQ = 14; PROTO_CMD_UDP_SAFESTOP_RES = 15;
    PROTO_CMD_CS_REQ_LOGIN = 2001; PROTO_CMD_CS_RES_LOGIN = 2002;
    PROTO_CMD_CS_MAP_NOTIFY_INIT_DATA = 2003; PROTO_CMD_CS_REQ_MAP_PING = 2004;
    PROTO_CMD_CS_RES_MAP_PONG = 2005; PROTO_CMD_CS_REQ_MAP_INPUT = 2006;
    PROTO_CMD_CS_MAP_NOTIFY_STATE_DATA = 2007; PROTO_CMD_CS_MAP_ENTER_REQ = 2008;
    PROTO_CMD_CS_MAP_ENTER_RES = 2009; PROTO_CMD_CS_MAP_LEAVE_REQ = 2010;
    PROTO_CMD_CS_MAP_LEAVE_RES = 2011; PROTO_CMD_CS_MAP3D_NOTIFY_INIT_DATA = 2012;
    PROTO_CMD_CS_REQ_MAP3D_PING = 2013; PROTO_CMD_CS_RES_MAP3D_PONG = 2014;
    PROTO_CMD_CS_REQ_MAP3D_INPUT = 2015; PROTO_CMD_CS_MAP3D_NOTIFY_STATE_DATA = 2016;
    PROTO_CMD_CS_MAP3D_ENTER_REQ = 2017; PROTO_CMD_CS_MAP3D_ENTER_RES = 2018;
    PROTO_CMD_CS_MAP3D_LEAVE_REQ = 2019; PROTO_CMD_CS_MAP3D_LEAVE_RES = 2020;
    PROTO_CMD_CS_REQ_MAP3D_SHOOT = 2021; PROTO_CMD_CS_RES_MAP3D_SHOOT = 2022;
    PROTO_CMD_CS_MAP3D_NOTIFY_BULLET = 2023; PROTO_CMD_CS_MAP3D_NOTIFY_HIT_PLAYER = 2024;
    PROTO_CMD_CS_MAP3D_NOTIFY_PLAYER_HURT = 2025;
    PROTO_CMD_DBSVRGO_WRITE_DBUSERRECORD_REQ = 3000; PROTO_CMD_DBSVRGO_SELECT_DBUSERRECORD_REQ = 3001;
    PROTO_CMD_DBSVRGO_SELECT_DBUSERRECORD_RES = 3002; PROTO_CMD_CS_REQ_CREATE_USER = 3003;
    PROTO_CMD_CS_RES_CREATE_USER = 3004; PROTO_CMD_DBSVRGO_INSERT_DBUSERRECORD_REQ = 3005;
    PROTO_CMD_DBSVRGO_INSERT_DBUSERRECORD_RES = 3006; PROTO_CMD_DBSVRGO_SELECT_DBUSERRECORD_LOGIN_REQ = 3007;
    PROTO_CMD_DBSVRGO_SELECT_DBUSERRECORD_LOGIN_RES = 3008;
}
message ProtoPackage{ ProtoCmd cmd=1; bytes protocol=2; }
message ProtoCSReqLogin{ string userId=1; string password=2; }
message ProtoCSMap3DNotifyInitData{ string userId=1; int32 x=2; int32 y=3; int32 z=10; }
message ProtoCSReqMap3DInput{ int32 dirX=1; int32 dirY=2; int32 dirZ=3; uint32 seq=4; uint64 clientTime=5; }
message ProtoMap3DPlayerPayload{ string userId=1; int32 x=2; int32 y=3; int32 z=4; uint32 lastSeq=8; }
message ProtoCSMap3DNotifyStateData{ repeated ProtoMap3DPlayerPayload players=2; }
message ProtoCSMap3DEnterReq{ uint32 mapId=1; }
message ProtoCSMap3DEnterRes{ int32 ret=1; uint32 mapId=2; }
message ProtoCSReqCreateUser{ string userId=1; string password=2; }
message ProtoCSResCreateUser{ int32 ret=1; string userId=2; string password=3; uint64 userRecordID=4; }
message ProtoCSReqMap3DShoot{ string shooterId=1; int32 dirX=2; int32 dirY=3; int32 dirZ=4; int32 shootDist=5; uint64 clientTime=6; }
message ProtoCSResMap3DShoot{ int32 ret=1; int32 damage=2; }
message ProtoCSMap3DNotifyBullet{ string bulletId=1; string shooterId=2; int32 x=3; int32 y=4; int32 z=5; int32 dirX=6; int32 dirY=7; int32 dirZ=8; uint64 lifeTime=9; uint64 spawnTime=10; }
message ProtoCSMap3DNotifyHitPlayer{ string bulletId=1; string targetId=2; int32 damage=3; int32 targetX=4; int32 targetY=5; int32 targetZ=6; }
message ProtoCSMap3DNotifyPlayerHurt{ string targetId=1; int32 hp=2; int32 maxHp=3; int32 damage=4; int32 x=5; int32 y=6; int32 z=7; }
message ProtoCSReqMap3DPing{ uint64 clientTime=1; }
message ProtoCSResMap3DPong{ uint64 clientTime=1; uint64 serverTime=2; }
`;

        const root = protobuf.parse(protoText).root;
        const ProtoPackage = root.lookupType("avant.ProtoPackage");
        const Cmd = root.lookupEnum("avant.ProtoCmd").values;
        const T_Login = root.lookupType("avant.ProtoCSReqLogin");
        const T_Init = root.lookupType("avant.ProtoCSMap3DNotifyInitData");
        const T_State = root.lookupType("avant.ProtoCSMap3DNotifyStateData");
        const T_Input = root.lookupType("avant.ProtoCSReqMap3DInput");
        const T_Enter = root.lookupType("avant.ProtoCSMap3DEnterReq");
        const T_CreateU = root.lookupType("avant.ProtoCSReqCreateUser");
        const T_CreateR = root.lookupType("avant.ProtoCSResCreateUser");
        const T_Shoot = root.lookupType("avant.ProtoCSReqMap3DShoot");
        const T_ShootR = root.lookupType("avant.ProtoCSResMap3DShoot");
        const T_Bullet = root.lookupType("avant.ProtoCSMap3DNotifyBullet");
        const T_Hit = root.lookupType("avant.ProtoCSMap3DNotifyHitPlayer");
        const T_Hurt = root.lookupType("avant.ProtoCSMap3DNotifyPlayerHurt");
        const T_Ping = root.lookupType("avant.ProtoCSReqMap3DPing");
        const T_Pong = root.lookupType("avant.ProtoCSResMap3DPong");

        const SHOOT_DIST = 200;
        const GROUND_Y = 500000;

        const players = new Map();
        const bullets = new Map();
        let selfId = null;
        let lastSeq = 0;
        let kills = 0, deaths = 0;
        let myHp = 100, myMaxHp = 100;

        const logEl = document.getElementById("log");
        function log(...a) {
            const msg = new Date().toLocaleTimeString() + " " + a.join(" ");
            logEl.textContent = msg + "\n" + logEl.textContent;
            if (logEl.textContent.length > 3000) logEl.textContent = "";
        }
        function killfeed(text) {
            const el = document.getElementById("killfeed");
            const d = document.createElement("div");
            d.textContent = text; el.appendChild(d);
            setTimeout(() => d.remove(), 4000);
        }

        /* ------- 新增: 遥测条 / 控制台 / 漂移仪表 引用 ------- */
        const telemUserEl = document.getElementById("telemUser");
        const telemMapEl = document.getElementById("telemMap");
        const telemSeqEl = document.getElementById("telemSeq");
        const telemRttEl = document.getElementById("telemRtt");
        const telemOnlineEl = document.getElementById("telemOnline");
        const connDotEl = document.getElementById("connDot");
        const connStateEl = document.getElementById("connState");
        const consoleEl = document.getElementById("console");
        const consoleTabEl = document.getElementById("consoleTab");
        const hintEl = document.getElementById("hint");
        const crosshairEl = document.getElementById("crosshair");

        function setConn(state) {
            connDotEl.className = "dot " + state;
            const txt = { offline: "离线", connecting: "连接中", online: "已连接", error: "错误" }[state] || state;
            connStateEl.textContent = txt;
            connStateEl.style.color = state === "online" ? "var(--signal)" : state === "error" ? "var(--ember)" : "var(--steel)";
        }

        function setConsole(open) {
            consoleEl.classList.toggle("collapsed", !open);
            consoleTabEl.innerHTML = open ? "控制台 ▸" : "◂ 控制台";
            consoleTabEl.setAttribute("aria-expanded", String(open));
        }
        consoleTabEl.addEventListener("click", () => {
            setConsole(consoleEl.classList.contains("collapsed"));
        });

        /* ------- 漂移仪表 (签名元素) ------- */
        const driftCanvas = document.getElementById("driftCanvas");
        const driftCtx = driftCanvas.getContext("2d");
        const driftValEl = document.getElementById("driftVal");
        const toggleOthersEl = document.getElementById("toggleOthers");
        const othersWrapEl = document.getElementById("othersWrap");
        const driftBuf = [];
        let lastDrift = 0;
        let driftGood = true;
        let othersOpen = false;

        toggleOthersEl.addEventListener("click", () => {
            othersOpen = !othersOpen;
            othersWrapEl.classList.toggle("open", othersOpen);
        });

        function drawDrift() {
            const cw = driftCanvas.width, ch = driftCanvas.height;
            driftCtx.clearRect(0, 0, cw, ch);
            // 基线
            driftCtx.strokeStyle = "rgba(143,166,200,.18)";
            driftCtx.lineWidth = 1;
            driftCtx.beginPath();
            driftCtx.moveTo(0, ch - 4);
            driftCtx.lineTo(cw, ch - 4);
            driftCtx.stroke();
            if (!selfId || driftBuf.length === 0) {
                driftValEl.textContent = "—";
                driftValEl.className = "val";
                return;
            }
            const max = 20;
            const color = driftGood ? "#6fe9b0" : "#ffc857";
            const n = driftBuf.length;
            driftCtx.strokeStyle = color;
            driftCtx.lineWidth = 2;
            driftCtx.beginPath();
            for (let i = 0; i < n; i++) {
                const x = 2 + (i / 39) * (cw - 4);
                const y = ch - 4 - Math.min(driftBuf[i], max) / max * (ch - 10);
                i === 0 ? driftCtx.moveTo(x, y) : driftCtx.lineTo(x, y);
            }
            driftCtx.stroke();
            // 当前采样点
            const cx = 2 + ((n - 1) / 39) * (cw - 4);
            const cy = ch - 4 - Math.min(driftBuf[n - 1], max) / max * (ch - 10);
            driftCtx.beginPath();
            driftCtx.arc(cx, cy, 3, 0, Math.PI * 2);
            driftCtx.fillStyle = color;
            driftCtx.fill();
            driftValEl.textContent = lastDrift.toFixed(1);
            driftValEl.className = "val " + (driftGood ? "good" : "warn");
        }

        let ws = null;
        function sendInner(type, obj, cmd) {
            if (!ws || ws.readyState !== 1) return;
            const inner = type.encode(type.create(obj)).finish();
            const pkg = ProtoPackage.encode(ProtoPackage.create({ cmd, protocol: inner })).finish();
            ws.send(pkg);
            telemSeqEl.textContent = String(lastSeq);
        }

        function handlePkg(msg) {
            switch (msg.cmd) {
                case Cmd.PROTO_CMD_CS_RES_LOGIN: log("✓ 登录成功"); break;
                case Cmd.PROTO_CMD_CS_MAP3D_NOTIFY_INIT_DATA: {
                    const d = T_Init.decode(msg.protocol);
                    selfId = String(d.userId);
                    telemUserEl.textContent = selfId;
                    if (!players.has(selfId)) {
                        const p = createPlayerMesh(true, selfId);
                        players.set(selfId, p);
                    }
                    const me = players.get(selfId);
                    me.group.position.set(d.x, d.y, d.z);
                    me.prevPos.set(d.x, d.y, d.z);
                    me.targetPos.set(d.x, d.y, d.z);
                    localPos.set(d.x, d.y, d.z);
                    serverPos.set(d.x, d.y, d.z);
                    break;
                }
                case Cmd.PROTO_CMD_CS_MAP3D_NOTIFY_STATE_DATA: {
                    const s = T_State.decode(msg.protocol);
                    document.getElementById("online").textContent = s.players.length;
                    telemOnlineEl.textContent = String(s.players.length);
                    const seen = new Set();
                    s.players.forEach(p => {
                        const pId = String(p.userId);
                        seen.add(pId);
                        let m = players.get(pId);
                        if (!m) {
                            m = createPlayerMesh(pId === selfId, pId);
                            players.set(pId, m);
                        }
                        m.targetPos.set(p.x, p.y, p.z);
                        m.updateTime = performance.now();
                        if (pId === selfId) serverPos.set(p.x, p.y, p.z);
                    });
                    players.forEach((m, id) => {
                        if (!seen.has(id) && id !== selfId) {
                            scene.remove(m.group);
                            players.delete(id);
                        }
                    });
                    break;
                }
                case Cmd.PROTO_CMD_CS_MAP3D_ENTER_RES:
                    telemMapEl.textContent = "4";
                    setConsole(false);
                    document.getElementById("blocker").classList.remove("hidden");
                    break;
                case Cmd.PROTO_CMD_CS_MAP3D_NOTIFY_BULLET: {
                    const b = T_Bullet.decode(msg.protocol);
                    handleBullet(b); break;
                }
                case Cmd.PROTO_CMD_CS_MAP3D_NOTIFY_HIT_PLAYER: {
                    const h = T_Hit.decode(msg.protocol);
                    killfeed(`你命中 ${h.targetId} → -${h.damage}HP`);
                    createHitEffect(h.targetX, h.targetY, h.targetZ);
                    break;
                }
                case Cmd.PROTO_CMD_CS_MAP3D_NOTIFY_PLAYER_HURT: {
                    const h = T_Hurt.decode(msg.protocol);
                    const targetIdStr = String(h.targetId);
                    if (targetIdStr === selfId) {
                        myHp = h.hp; myMaxHp = h.maxHp;
                        updateHpUI(); flashDamage();
                        if (h.hp <= 0) { deaths++; document.getElementById("deaths").textContent = deaths; }
                    }
                    const pm = players.get(targetIdStr);
                    if (pm) showDamageNumber(h.x, h.y + 3, h.z, h.damage);
                    break;
                }
                case Cmd.PROTO_CMD_CS_RES_MAP3D_SHOOT: {
                    const r = T_ShootR.decode(msg.protocol);
                    if (r.damage > 0) { kills++; document.getElementById("kills").textContent = kills; }
                    break;
                }
                case Cmd.PROTO_CMD_CS_RES_MAP3D_PONG: {
                    try {
                        const o = T_Pong.toObject(T_Pong.decode(msg.protocol), { longs: Number });
                        const rtt = Date.now() - Number(o.clientTime);
                        if (rtt >= 0 && rtt < 60000) {
                            telemRttEl.textContent = rtt + "ms";
                            telemRttEl.style.color = "var(--signal)";
                        }
                    } catch (e) { /* 服务器未实现 ping/pong 则忽略 */ }
                    break;
                }
            }
        }

        document.getElementById("btnConnect").onclick = () => {
            if (ws && ws.readyState === 1) return;
            telemUserEl.textContent = document.getElementById("userId").value;
            setConn("connecting");
            ws = new WebSocket(document.getElementById("wsUrl").value);
            ws.binaryType = "arraybuffer";
            ws.onopen = () => { log("✓ WS 已连接"); setConn("online"); };
            ws.onclose = () => { log("✗ WS 断开"); setConn("offline"); };
            ws.onerror = () => { log("✗ WS 错误"); setConn("error"); };
            ws.onmessage = ev => {
                try {
                    const msg = ProtoPackage.decode(new Uint8Array(ev.data));
                    handlePkg(msg);
                } catch (err) { log("✗ 解包失败:", err.message || err); }
            };
        };
        document.getElementById("btnLogin").onclick = () => {
            telemUserEl.textContent = document.getElementById("userId").value;
            sendInner(T_Login, { userId: document.getElementById("userId").value, password: document.getElementById("password").value }, Cmd.PROTO_CMD_CS_REQ_LOGIN);
        };
        document.getElementById("btnEnter").onclick = () => {
            sendInner(T_Enter, { mapId: 4 }, Cmd.PROTO_CMD_CS_MAP3D_ENTER_REQ);
        };
        document.getElementById("btnCreateUser").onclick = () => {
            sendInner(T_CreateU, { userId: document.getElementById("userId").value, password: document.getElementById("password").value }, Cmd.PROTO_CMD_CS_REQ_CREATE_USER);
        };

        /* RTT 探测: 每 2.5s 发一次 3D ping (服务器未实现则显示 —) */
        setInterval(() => {
            if (ws && ws.readyState === 1) {
                lastSeq++;
                sendInner(T_Ping, { clientTime: Date.now() }, Cmd.PROTO_CMD_CS_REQ_MAP3D_PING);
            }
        }, 2500);

        /* ---------------- Three.js 场景 ---------------- */
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1322);
        scene.fog = new THREE.Fog(0x0a1322, 80, 400);

        const camera = new THREE.PerspectiveCamera(78, innerWidth / innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.HemisphereLight(0x88aaff, 0x223344, 0.7));
        const sun = new THREE.DirectionalLight(0xffeecc, 1.0);
        sun.position.set(60, GROUND_Y + 120, 40); sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.left = -120; sun.shadow.camera.right = 120;
        sun.shadow.camera.top = 120; sun.shadow.camera.bottom = -120;
        sun.shadow.camera.near = 1; sun.shadow.camera.far = 400;
        scene.add(sun);
        const sunTarget = new THREE.Object3D();
        sunTarget.position.set(0, GROUND_Y, 0);
        scene.add(sunTarget);
        sun.target = sunTarget;
        scene.add(new THREE.AmbientLight(0xffffff, 0.25));

        const groundTex = makeGroundTexture();
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(2000, 2000),
            new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.95, metalness: 0.0 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = GROUND_Y;
        ground.receiveShadow = true;
        scene.add(ground);

        function makeGroundTexture() {
            const c = document.createElement("canvas"); c.width = c.height = 512;
            const g = c.getContext("2d");
            g.fillStyle = "#0e1a2e"; g.fillRect(0, 0, 512, 512);
            g.strokeStyle = "#1a2f4e"; g.lineWidth = 2;
            for (let i = 0; i <= 512; i += 64) {
                g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 512); g.stroke();
                g.beginPath(); g.moveTo(0, i); g.lineTo(512, i); g.stroke();
            }
            const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;
            t.repeat.set(40, 40); return t;
        }

        const obstacles = [];
        function addBox(x, yRel, z, w, h, d, color) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
                new THREE.MeshStandardMaterial({ color, roughness: 0.8 }));
            m.position.set(x, GROUND_Y + yRel, z); m.castShadow = true; m.receiveShadow = true;
            scene.add(m); obstacles.push({ mesh: m, half: new THREE.Vector3(w / 2, h / 2, d / 2) });
            return m;
        }
        for (let i = 0; i < 14; i++) {
            const x = (Math.random() - 0.5) * 180, z = (Math.random() - 0.5) * 180;
            const h = 2 + Math.random() * 5, w = 3 + Math.random() * 4, d = 3 + Math.random() * 4;
            addBox(x, h / 2, z, w, h, d, new THREE.Color().setHSL(0.6, 0.3, 0.2 + Math.random() * 0.1));
        }
        addBox(0, 1.5, 0, 4, 3, 4, 0x2a4a6a);

        const gridHelper = new THREE.GridHelper(400, 80, 0x1a3a5c, 0x0f243f);
        gridHelper.position.y = GROUND_Y;
        scene.add(gridHelper);

        const viewModel = new THREE.Group();
        camera.add(viewModel);
        scene.add(camera);

        const gunMat = new THREE.MeshStandardMaterial({ color: 0x222831, roughness: 0.5, metalness: 0.7 });
        const gunMat2 = new THREE.MeshStandardMaterial({ color: 0x11151c, roughness: 0.6, metalness: 0.6 });
        const gunMat3 = new THREE.MeshStandardMaterial({ color: 0x3a3f4a, roughness: 0.4, metalness: 0.8 });

        const body = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, 0.5), gunMat);
        body.position.set(0, -0.05, -0.35); viewModel.add(body);
        const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.45, 12), gunMat2);
        barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.02, -0.65); viewModel.add(barrel);
        const grip = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.18, 0.12), gunMat);
        grip.position.set(0, -0.16, -0.18); grip.rotation.x = 0.3; viewModel.add(grip);
        const mag = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.16, 0.1), gunMat3);
        mag.position.set(0, -0.14, -0.32); viewModel.add(mag);
        const sight = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.05, 0.08), gunMat2);
        sight.position.set(0, 0.08, -0.35); viewModel.add(sight);
        const muzzle = new THREE.Object3D();
        muzzle.position.set(0, 0.02, -0.9); viewModel.add(muzzle);

        const flashMat = new THREE.MeshBasicMaterial({ color: 0xffdd66, transparent: true, opacity: 0 });
        const flash = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), flashMat);
        flash.position.copy(muzzle.position); viewModel.add(flash);
        let flashTime = 0;
        viewModel.position.set(0.18, -0.18, 0);

        function createPlayerMesh(isSelf, id) {
            const group = new THREE.Group();
            const pBody = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 1.0, 6, 12),
                new THREE.MeshStandardMaterial({ color: isSelf ? 0x20c997 : 0x3aa0ff, emissive: isSelf ? 0x0a4d3a : 0x1a5080, emissiveIntensity: 0.25, roughness: 0.6 }));
            pBody.position.y = 1.1; pBody.castShadow = true;
            group.add(pBody);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0xf0c090, roughness: 0.7 }));
            head.position.y = 2.0; head.castShadow = true;
            group.add(head);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const e1 = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), eyeMat);
            e1.position.set(-0.12, 2.05, 0.3); group.add(e1);
            const e2 = e1.clone(); e2.position.x = 0.12; group.add(e2);
            const armMat = new THREE.MeshStandardMaterial({ color: isSelf ? 0x169970 : 0x2a7ad0, roughness: 0.6 });
            const larm = new THREE.Mesh(new THREE.CapsuleGeometry(0.15, 0.8, 4, 8), armMat);
            larm.position.set(-0.65, 1.2, 0); larm.castShadow = true; group.add(larm);
            const rarm = larm.clone(); rarm.position.x = 0.65; group.add(rarm);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x1a2540, roughness: 0.7 });
            const lleg = new THREE.Mesh(new THREE.CapsuleGeometry(0.18, 0.7, 4, 8), legMat);
            lleg.position.set(-0.22, 0.45, 0); lleg.castShadow = true; group.add(lleg);
            const rleg = lleg.clone(); rleg.position.x = 0.22; group.add(rleg);
            const pgun = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, 0.5),
                new THREE.MeshStandardMaterial({ color: 0x222831, metalness: 0.6, roughness: 0.5 }));
            pgun.position.set(0.5, 1.2, -0.25); group.add(pgun);
            const label = makeLabel(id || "");
            label.position.y = 2.6; group.add(label);
            if (isSelf) group.visible = false;
            group.frustumCulled = false;
            scene.add(group);
            return { group, mesh: pBody, label, prevPos: new THREE.Vector3(), targetPos: new THREE.Vector3(), updateTime: performance.now() };
        }

        function makeLabel(text) {
            const c = document.createElement("canvas"); c.width = 256; c.height = 64;
            const g = c.getContext("2d");
            g.fillStyle = "rgba(0,0,0,0.5)"; g.fillRect(0, 0, 256, 64);
            g.font = "bold 28px sans-serif"; g.fillStyle = "#ffcc44";
            g.textAlign = "center"; g.textBaseline = "middle";
            g.fillText(text, 128, 32);
            const tex = new THREE.CanvasTexture(c);
            const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
            sp.scale.set(2, 0.5, 1); return sp;
        }

        function createBulletMesh() {
            const g = new THREE.SphereGeometry(0.18, 8, 8);
            const m = new THREE.MeshBasicMaterial({ color: 0xffee44, transparent: true });
            const mesh = new THREE.Mesh(g, m);
            const trail = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xffaa33, transparent: true, opacity: 0.7 }));
            scene.add(mesh); scene.add(trail);
            return { mesh, trail, points: [] };
        }
        function handleBullet(b) {
            let bl = bullets.get(b.bulletId);
            if (!bl) { bl = createBulletMesh(); bullets.set(b.bulletId, bl); }
            const pos = new THREE.Vector3(b.x, b.y, b.z);
            bl.mesh.position.copy(pos);
            bl.points.push(pos.clone());
            if (bl.points.length > 20) bl.points.shift();
            bl.trail.geometry.setFromPoints(bl.points);
            bl.born = performance.now();
        }
        function cleanupBullet(id) {
            const bl = bullets.get(id); if (!bl) return;
            scene.remove(bl.mesh); scene.remove(bl.trail);
            bl.mesh.geometry.dispose(); bl.trail.geometry.dispose();
            bullets.delete(id);
        }

        function createHitEffect(x, y, z) {
            const grp = new THREE.Group();
            for (let i = 0; i < 10; i++) {
                const p = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), new THREE.MeshBasicMaterial({ color: 0xff6633, transparent: true }));
                p.position.set(x, y, z);
                const v = new THREE.Vector3((Math.random() - 0.5), Math.random(), (Math.random() - 0.5)).multiplyScalar(6);
                p.userData.v = v; grp.add(p);
            }
            const ring = new THREE.Mesh(new THREE.RingGeometry(0.3, 0.8, 16), new THREE.MeshBasicMaterial({ color: 0xff3333, side: THREE.DoubleSide, transparent: true }));
            ring.position.set(x, y, z); ring.userData.life = 1; grp.add(ring);
            scene.add(grp);
            const start = performance.now();
            (function anim() {
                const t = (performance.now() - start) / 1000;
                if (t > 0.6) {
                    scene.remove(grp);
                    grp.children.forEach(p => { p.geometry.dispose(); p.material.dispose(); });
                    return;
                }
                grp.children.forEach(p => {
                    if (p.userData.v) {
                        p.position.addScaledVector(p.userData.v, 0.016);
                        p.userData.v.y -= 9.8 * 0.016; p.material.opacity = 1 - t / 0.6;
                    }
                    if (p.userData.life) { p.scale.setScalar(1 + t * 3); p.material.opacity = 1 - t / 0.6; }
                });
                requestAnimationFrame(anim);
            })();
        }

        const dmgNums = [];
        function showDamageNumber(x, y, z, dmg) {
            const c = document.createElement("canvas"); c.width = 128; c.height = 64;
            const g = c.getContext("2d");
            g.font = "bold 48px sans-serif"; g.fillStyle = "#ff4444";
            g.textAlign = "center"; g.fillText("-" + dmg, 64, 48);
            const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthTest: false }));
            sp.position.set(x, y, z); sp.scale.set(1.5, 0.75, 1);
            sp.userData.life = 1; sp.userData.vy = 2;
            scene.add(sp); dmgNums.push(sp);
        }

        let yaw = 0, pitch = 0;
        const EYE_HEIGHT = 2.0;
        const PLAYER_RADIUS = 0.6;
        const blocker = document.getElementById("blocker");
        blocker.addEventListener("click", () => { renderer.domElement.requestPointerLock(); });
        document.addEventListener("pointerlockchange", () => {
            if (document.pointerLockElement === renderer.domElement) {
                blocker.classList.add("hidden");
                hintEl.classList.add("hide");
            } else {
                if (ws && ws.readyState === 1) blocker.classList.remove("hidden");
                hintEl.classList.remove("hide");
            }
        });
        document.addEventListener("mousemove", e => {
            if (document.pointerLockElement !== renderer.domElement) return;
            const sens = 0.0022;
            yaw -= e.movementX * sens;
            pitch -= e.movementY * sens;
            pitch = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, pitch));
        });

        const localPos = new THREE.Vector3();
        const serverPos = new THREE.Vector3();
        const velY = { v: 0 };
        let onGround = true;
        const GRAVITY = 28;
        const JUMP_SPEED = 10;
        const MOVE_SPEED = 7;
        const INPUT_SEND_SPEED = 2;
        const key = {};
        addEventListener("keydown", e => {
            key[e.key.toLowerCase()] = true;
            if (e.code === "Space") { e.preventDefault(); tryJump(); }
        });
        addEventListener("keyup", e => key[e.key.toLowerCase()] = false);

        function tryJump() { if (onGround) { velY.v = JUMP_SPEED; onGround = false; } }

        function collide(pos) {
            for (const o of obstacles) {
                const dx = pos.x - o.mesh.position.x, dy = pos.y - o.mesh.position.y, dz = pos.z - o.mesh.position.z;
                const hx = o.half.x + PLAYER_RADIUS, hy = o.half.y + 10, hz = o.half.z + PLAYER_RADIUS;
                if (Math.abs(dx) < hx && Math.abs(dy) < hy && Math.abs(dz) < hz) {
                    const px = hx - Math.abs(dx), pz = hz - Math.abs(dz);
                    if (px < pz) pos.x += dx > 0 ? px : -px;
                    else pos.z += dz > 0 ? pz : -pz;
                }
            }
        }

        setInterval(() => {
            if (!selfId) return;
            const f = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
            const r = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
            let mx = 0, mz = 0;
            if (key.w) { mx += f.x; mz += f.z; }
            if (key.s) { mx -= f.x; mz -= f.z; }
            if (key.a) { mx -= r.x; mz -= r.z; }
            if (key.d) { mx += r.x; mz += r.z; }
            let my = 0;
            if (!onGround && velY.v > 0) my = INPUT_SEND_SPEED;
            else if (key.shift) my = -INPUT_SEND_SPEED;
            const len = Math.hypot(mx, mz);
            if (len > 0) { mx = mx / len * INPUT_SEND_SPEED; mz = mz / len * INPUT_SEND_SPEED; }
            lastSeq++;
            sendInner(T_Input, { dirX: Math.round(mx), dirY: Math.round(my), dirZ: Math.round(mz), seq: lastSeq, clientTime: Date.now() }, Cmd.PROTO_CMD_CS_REQ_MAP3D_INPUT);
        }, 80);

        let lastShootTime = 0;
        const SHOOT_COOLDOWN = 140;

        function shoot() {
            if (!selfId) return;
            const now = Date.now();
            if (now - lastShootTime < SHOOT_COOLDOWN) return;
            lastShootTime = now;
            viewModel.position.z = 0.06;
            flashTime = 0.05;
            flash.material.opacity = 1;
            flash.scale.setScalar(1 + Math.random() * 0.6);

            // 准星后坐力反馈
            crosshairEl.classList.remove("kick");
            void crosshairEl.offsetWidth;
            crosshairEl.classList.add("kick");

            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            const dirXn = Math.round(dir.x * 10000);
            const dirYn = Math.round(dir.y * 10000);
            const dirZn = Math.round(dir.z * 10000);

            sendInner(T_Shoot, {
                shooterId: selfId,
                dirX: dirXn, dirY: dirYn, dirZ: dirZn,
                shootDist: SHOOT_DIST, clientTime: Date.now()
            }, Cmd.PROTO_CMD_CS_REQ_MAP3D_SHOOT);

            const ray = new THREE.Raycaster();
            ray.setFromCamera(new THREE.Vector2(0, 0), camera);
            const hit = ray.intersectObjects(obstacles.map(o => o.mesh), false);
            if (hit.length) {
                createTracer(muzzle.getWorldPosition(new THREE.Vector3()), hit[0].point);
            } else {
                const end = dir.clone().multiplyScalar(120).add(camera.getWorldPosition(new THREE.Vector3()));
                createTracer(muzzle.getWorldPosition(new THREE.Vector3()), end);
            }
        }

        function createTracer(a, b) {
            const g = new THREE.BufferGeometry().setFromPoints([a, b]);
            const l = new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xffee66, transparent: true, opacity: 0.8 }));
            scene.add(l);
            let t = 0;
            (function f() { t += 0.05; l.material.opacity = 0.8 - t; if (t > 0.8) { scene.remove(l); g.dispose(); l.material.dispose(); return; } requestAnimationFrame(f); })();
        }

        renderer.domElement.addEventListener("mousedown", e => {
            if (document.pointerLockElement === renderer.domElement) shoot();
        });

        function updateHpUI() {
            const pct = Math.max(0, myHp / myMaxHp);
            document.getElementById("hpfill").style.width = (pct * 100) + "%";
            document.getElementById("hptext").textContent = `HP ${myHp} / ${myMaxHp}`;
        }
        function flashDamage() {
            const f = document.getElementById("dmgflash");
            f.style.transition = "none"; f.style.opacity = "0.8";
            requestAnimationFrame(() => { f.style.transition = "opacity .5s"; f.style.opacity = "0"; });
        }
        updateHpUI();

        const cpSelfIdEl = document.getElementById("cpSelfId");
        const cpSelfLocalEl = document.getElementById("cpSelfLocal");
        const cpSelfSvrEl = document.getElementById("cpSelfServer");
        const cpOthersEl = document.getElementById("cpOthers");

        function fmt(v) { return v.toFixed(2).padStart(8, " "); }

        let cpAccum = 0;
        function updateCoordPanel(dt) {
            cpAccum += dt;
            if (cpAccum < 0.1) return;
            cpAccum = 0;

            // 漂移采样: |本机预测 - 服务器权威|
            if (selfId) {
                lastDrift = Math.hypot(localPos.x - serverPos.x, localPos.y - serverPos.y, localPos.z - serverPos.z);
                driftGood = lastDrift < 3;
                driftBuf.push(lastDrift);
                if (driftBuf.length > 40) driftBuf.shift();
            }
            drawDrift();

            cpSelfIdEl.innerHTML = `<span class="lbl">我的ID:　</span> ${selfId ?? "--"}`;
            cpSelfLocalEl.innerHTML = `<span class="lbl">本机(预测):</span> X${fmt(localPos.x)} Y${fmt(localPos.y)} Z${fmt(localPos.z)}`;
            cpSelfSvrEl.innerHTML = `<span class="lbl">服务器:　</span> X${fmt(serverPos.x)} Y${fmt(serverPos.y)} Z${fmt(serverPos.z)}`;
            let html = "", count = 0;
            players.forEach((p, id) => {
                if (id === selfId) return;
                count++;
                const t = p.targetPos;
                html += `<div class="cp-other"><span class="id">[${id}]</span> X${fmt(t.x)} Y${fmt(t.y)} Z${fmt(t.z)}</div>`;
            });
            cpOthersEl.innerHTML = count ? html : `<div class="cp-empty">暂无其他玩家</div>`;
            toggleOthersEl.textContent = `其他玩家 (${count}) ${othersOpen ? "▴" : "▾"}`;
        }

        const clock = new THREE.Clock();
        const _f = new THREE.Vector3();
        const _r = new THREE.Vector3();
        const _dir = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);

            if (selfId) {
                _f.set(Math.sin(yaw), 0, Math.cos(yaw));
                _r.set(Math.cos(yaw), 0, -Math.sin(yaw));
                let mx = 0, mz = 0;
                if (key.w) { mx += _f.x; mz += _f.z; }
                if (key.s) { mx -= _f.x; mz -= _f.z; }
                if (key.a) { mx -= _r.x; mz -= _r.z; }
                if (key.d) { mx += _r.x; mz += _r.z; }
                const len = Math.hypot(mx, mz);
                if (len > 0) { mx = mx / len * MOVE_SPEED * dt; mz = mz / len * MOVE_SPEED * dt; }

                localPos.x = localPos.x + mx + (serverPos.x - localPos.x) * Math.min(1, dt * 8);
                localPos.z = localPos.z + mz + (serverPos.z - localPos.z) * Math.min(1, dt * 8);

                velY.v -= GRAVITY * dt;
                localPos.y += velY.v * dt;
                if (localPos.y <= GROUND_Y) {
                    localPos.y = GROUND_Y;
                    velY.v = 0;
                    onGround = true;
                }

                collide(localPos);

                camera.position.set(localPos.x, localPos.y + EYE_HEIGHT, localPos.z);
                camera.rotation.order = "YXZ";
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            }

            viewModel.position.z += (0 - viewModel.position.z) * Math.min(1, dt * 12);
            if (flashTime > 0) { flashTime -= dt; if (flashTime <= 0) { flash.material.opacity = 0; } }

            players.forEach((p, id) => {
                if (id === selfId) return;
                _dir.subVectors(p.targetPos, p.group.position);
                p.group.position.lerp(p.targetPos, dt * 12);
                if (_dir.lengthSq() > 0.001) {
                    _dir.y = 0;
                    _dir.normalize();
                    const targetRot = Math.atan2(_dir.x, _dir.z);
                    let rotDiff = targetRot - p.group.rotation.y;
                    while (rotDiff > Math.PI) rotDiff -= Math.PI * 2;
                    while (rotDiff < -Math.PI) rotDiff += Math.PI * 2;
                    p.group.rotation.y += rotDiff * dt * 10;
                }
            });

            const now = performance.now();
            bullets.forEach((bl, id) => {
                if (now - bl.born > 2000) {
                    bl.mesh.material.opacity = Math.max(0, 1 - (now - bl.born - 2000) / 500);
                    if (now - bl.born > 2500) cleanupBullet(id);
                }
            });

            for (let i = dmgNums.length - 1; i >= 0; i--) {
                const s = dmgNums[i];
                s.userData.life -= dt;
                s.position.y += s.userData.vy * dt;
                s.userData.vy -= 2 * dt;
                s.material.opacity = Math.max(0, s.userData.life);
                if (s.userData.life <= 0) { scene.remove(s); dmgNums.splice(i, 1); }
            }

            updateCoordPanel(dt);
            renderer.render(scene, camera);
        }
        animate();

        addEventListener("resize", () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        log("✓ AVANT FPS 已初始化 (地面 Y=" + GROUND_Y + ")");
    </script>
</body>

</html>
