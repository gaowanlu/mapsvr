syntax = "proto3";

package avant;

option go_package = "/proto_res";

// PROTO_CMD_CS_REQ_EXAMPLE
message ProtoCSReqExample
{
    bytes testContext = 1;
}

// PROTO_CMD_CS_RES_EXAMPLE
message ProtoCSResExample
{
    bytes testContext = 1;
}

// PROTO_CMD_CS_REQ_LOGIN 登录
message ProtoCSReqLogin
{
    string userId=1;
    string password=2;
}

// PROTO_CMD_CS_RES_LOGIN 登录返回
message ProtoCSResLogin
{
    int32 ret=1;
    string sessionId=2;
}

// PROTO_CMD_CS_MAP_NOTIFY_INIT_DATA 进入地图发送init数据
message ProtoCSMapNotifyInitData
{
    string userId=1;
    int32 x=2;
    int32 y=3;
    uint64 serverTime=4;
    int32 tileSize=5;
    int32 width=6;
    int32 height=7;
    int32 mapId=8;
}

// PROTO_CMD_CS_REQ_MAP_PING 地图内客户端心跳请求
message ProtoCSReqMapPing
{
    uint64 clientTime=1;
}

// PROTO_CMD_CS_RES_MAP_PONG 地图内服务器响应客户端的心跳请求
message ProtoCSResMapPong
{
    uint64 clientTime=1;
    uint64 serverTime=2;
}

// PROTO_CMD_CS_REQ_MAP_INPUT 地图内客户端上报输入
message ProtoCSReqMapInput 
{
    int32 dirX=1;
    int32 dirY=2;
    uint32 seq=3;
    uint64 clientTime=4;
}

// PROTO_CMD_CS_MAP_NOTIFY_STATE_DATA 地图服务器同步状态给客户端
message ProtoMapPlayerPayload
{
    string userId=1;
    int32 x=2;
    int32 y=3;
    int32 vX=4;
    int32 vY=5;
    uint32 lastSeq=6;
    uint64 lastClientTime=7;
}
message ProtoCSMapNotifyStateData
{
    uint64 serverTime=1;
    repeated ProtoMapPlayerPayload players=2;
}

// PROTO_CMD_CS_MAP_ENTER_REQ 进入地图请求
message ProtoCSMapEnterReq
{
    uint32 mapId=1;
}

// PROTO_CMD_CS_MAP_ENTER_RES 进入地图返回
message ProtoCSMapEnterRes
{
    int32 ret=1;
    uint32 mapId=2;
}

// PROTO_CMD_CS_MAP_LEAVE_REQ 离开地图请求
message ProtoCSMapLeaveReq 
{
    int32 nothing=1;
}

// PROTO_CMD_CS_MAP_LEAVE_RES 离开地图返回
message ProtoCSMapLeaveRes
{
    int32 ret=1;
}

// PROTO_CMD_CS_MAP3D_NOTIFY_INIT_DATA 进入地图3D发送init数据
message ProtoCSMap3DNotifyInitData
{
    string userId=1;
    int32 x=2;
    int32 y=3;
    uint64 serverTime=4;
    int32 xSize=6;
    int32 ySize=7;
    int32 zSize=8;
    int32 mapId=9;
    int32 z=10;
}

// PROTO_CMD_CS_REQ_MAP3D_PING 地图3D内客户端心跳请求
message ProtoCSReqMap3DPing
{
    uint64 clientTime=1;
}

// PROTO_CMD_CS_RES_MAP3D_PONG 地图3D内服务器响应客户端的心跳请求
message ProtoCSResMap3DPong
{
    uint64 clientTime=1;
    uint64 serverTime=2;
}

// PROTO_CMD_CS_REQ_MAP3D_INPUT 地图3D内客户端上报输入
message ProtoCSReqMap3DInput 
{
    int32 dirX=1;
    int32 dirY=2;
    int32 dirZ=3;
    uint32 seq=4;
    uint64 clientTime=5;
}

// PROTO_CMD_CS_MAP3D_NOTIFY_STATE_DATA 地图3D服务器同步状态给客户端
message ProtoMap3DPlayerPayload
{
    string userId=1;
    int32 x=2;
    int32 y=3;
    int32 z=4;
    int32 vX=5;
    int32 vY=6;
    int32 vZ=7;
    uint32 lastSeq=8;
    uint64 lastClientTime=9;
}
message ProtoCSMap3DNotifyStateData
{
    uint64 serverTime=1;
    repeated ProtoMap3DPlayerPayload players=2;
}

// PROTO_CMD_CS_MAP3D_ENTER_REQ 进入地图3D请求
message ProtoCSMap3DEnterReq
{
    uint32 mapId=1;
}

// PROTO_CMD_CS_MAP3D_ENTER_RES 进入地图3D返回
message ProtoCSMap3DEnterRes
{
    int32 ret=1;
    uint32 mapId=2;
}

// PROTO_CMD_CS_MAP3D_LEAVE_REQ 离开地图3D请求
message ProtoCSMap3DLeaveReq 
{
    int32 nothing=1;
}

// PROTO_CMD_CS_MAP3D_LEAVE_RES 离开地图3D返回
message ProtoCSMap3DLeaveRes
{
    int32 ret=1;
}

// PROTO_CMD_CS_REQ_CREATE_USER 创建新账号请求
message ProtoCSReqCreateUser
{
    string userId=1;
    string password=2;
}

// PROTO_CMD_CS_RES_CREATE_USER 创建新账号返回
message ProtoCSResCreateUser
{
    int32 ret=1;
    string userId=2;
    string password=3;
    uint64 userRecordID=4;
}

// Map3D射击请求
// PROTO_CMD_CS_REQ_MAP3D_SHOOT
message ProtoCSReqMap3DShoot
{
  string shooterId=1;
  int32 dirX=2;   // 子弹方向向量X分量（由客户端计算并归一化）
  int32 dirY=3;   // 子弹方向向量Y分量
  int32 dirZ=4;   // 子弹方向向量Z分量
  int32 shootDist=5;  // 射击距离（像素单位）
  uint64 clientTime=6;
}

// Map3D射击返回
// PROTO_CMD_CS_RES_MAP3D_SHOOT
message ProtoCSResMap3DShoot
{
  int32 ret=1;
  int32 damage=2;
}

// Map3D子弹状态同步
// PROTO_CMD_CS_MAP3D_NOTIFY_BULLET
message ProtoCSMap3DNotifyBullet
{
  string bulletId=1;
  string shooterId=2;
  int32 x=3;
  int32 y=4;
  int32 z=5;
  int32 dirX=6;
  int32 dirY=7;
  int32 dirZ=8;
  uint64 lifeTime=9;
  uint64 spawnTime=10;
}

// Map3D击中玩家通知
// PROTO_CMD_CS_MAP3D_NOTIFY_HIT_PLAYER
message ProtoCSMap3DNotifyHitPlayer
{
  string bulletId=1;
  string targetId=2;
  int32 damage=3;
  int32 targetX=4;
  int32 targetY=5;
  int32 targetZ=6;
}

// Map3D玩家受伤通知
// PROTO_CMD_CS_MAP3D_NOTIFY_PLAYER_HURT
message ProtoCSMap3DNotifyPlayerHurt
{
  string targetId=1;
  int32 hp=2;
  int32 maxHp=3;
  int32 damage=4;
  int32 x=5;
  int32 y=6;
  int32 z=7;
}

// Map3D地图墙体/建筑盒子
// 坐标为地图本地坐标×1000: x/z 相对地图中心(出生点), y 相对地面
message ProtoMap3DBoxData
{
  int32 x=1;
  int32 y=2;
  int32 z=3;
  int32 w=4;
  int32 h=5;
  int32 d=6;
  uint32 color=7;
  bool collide=8;
}

// Map3D地图墙体/建筑配置下发(玩家进入地图时发送)
// PROTO_CMD_CS_MAP3D_NOTIFY_MAP_DATA
message ProtoCSMap3DNotifyMapData
{
  uint32 mapId=1;
  string name=2;
  int32 groundY=3;
  repeated ProtoMap3DBoxData boxes=4;
  // 地图中心绝对坐标(客户端据此校准本地原点, 玩家环状出生点不等于地图中心)
  int32 centerX=5;
  int32 centerZ=6;
}

// Map3D子弹击中墙体/建筑通知(碰撞点)
// PROTO_CMD_CS_MAP3D_NOTIFY_BULLET_WALL_HIT
message ProtoCSMap3DNotifyBulletWallHit
{
  string bulletId=1;
  string shooterId=2;
  int32 x=3;
  int32 y=4;
  int32 z=5;
}


// Map3D房间文字聊天请求
// PROTO_CMD_CS_REQ_MAP3D_CHAT
message ProtoCSReqMap3DChat
{
  string message=1;  // 聊天内容(发送者由会话playerId确定, 不信任客户端)
}

// Map3D房间文字聊天广播
// PROTO_CMD_CS_MAP3D_NOTIFY_CHAT
message ProtoCSMap3DNotifyChat
{
  string senderId=1;
  string message=2;
}
